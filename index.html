
<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ÖMER AI</title>
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#101329">

  <style>
*{box-sizing:border-box}
:root{
  --bg:#101329;
  --panel:#191e35;
  --panel2:#222943;
  --text:#fff;
  --muted:#a5acc8;
  --accent:#7775ff;
  --border:#303754;
}
body{
  margin:0;
  background:var(--bg);
  color:var(--text);
  font-family:Arial,sans-serif;
  height:100dvh;
  overflow:hidden;
}
button,input,select,textarea{font:inherit}
button{cursor:pointer}
.app{height:100dvh;display:flex;flex-direction:column}
header{
  height:65px;flex-shrink:0;
  display:flex;align-items:center;
  justify-content:space-between;
  padding:0 17px;
  border-bottom:1px solid var(--border);
  background:var(--bg);
}
.brand{display:flex;align-items:center;gap:11px;font-size:19px;font-weight:bold}
.icon-btn{
  width:42px;height:42px;border:0;border-radius:13px;
  color:white;background:var(--panel2);font-size:22px;
}
.header-actions{display:flex;gap:9px}
.chat{
  flex:1;min-height:0;overflow-y:auto;
  padding:22px 16px;
  display:flex;flex-direction:column;gap:17px;
  width:100%;
}
.welcome{
  margin:auto;
  text-align:center;
  max-width:600px;
  padding:25px 10px;
}
.robot{font-size:55px;margin-bottom:14px}
.welcome h1{font-size:29px;margin:0 0 12px}
.welcome p{color:var(--muted);line-height:1.6}
.message{
  max-width:min(800px,90%);
  padding:13px 16px;
  border-radius:17px;
  line-height:1.6;
  white-space:pre-wrap;
  overflow-wrap:anywhere;
}
.user{
  align-self:flex-end;
  background:#5654bd;
  border-bottom-right-radius:5px;
}
.bot{
  align-self:flex-start;
  background:var(--panel);
  border:1px solid var(--border);
  border-bottom-left-radius:5px;
}
.typing{color:var(--muted);font-style:italic}
.composer-wrap{
  flex-shrink:0;
  padding:12px 14px 18px;
  background:var(--bg);
}
.composer{
  max-width:1000px;margin:auto;
  display:flex;align-items:flex-end;gap:9px;
  background:var(--panel);
  border:1px solid var(--border);
  border-radius:20px;padding:10px;
}
#mesaj{
  flex:1;min-width:0;max-height:150px;min-height:42px;
  resize:none;border:0;outline:0;background:transparent;
  color:white;padding:11px 5px;
}
#mesaj::placeholder{color:var(--muted)}
.send{
  background:var(--accent);border:0;color:white;
  border-radius:14px;width:44px;height:44px;font-size:20px;
}
.tool{
  border:0;background:transparent;color:var(--muted);
  width:42px;height:44px;border-radius:12px;font-size:20px;
}
.tool:hover,.icon-btn:hover{background:#343b60}
#dosya{display:none}
.hint{text-align:center;color:var(--muted);font-size:11px;margin-top:9px}

/* Kaydırmalı menü */
.overlay{
  position:fixed;inset:0;background:#0009;
  opacity:0;visibility:hidden;transition:.28s;z-index:10;
}
.overlay.open{opacity:1;visibility:visible}
.drawer{
  position:fixed;z-index:11;left:0;top:0;bottom:0;
  width:min(310px,85vw);
  background:var(--panel);
  border-right:1px solid var(--border);
  transform:translateX(-105%);
  transition:transform .32s cubic-bezier(.2,.8,.2,1);
  padding:19px;overflow-y:auto;
}
.drawer.open{transform:translateX(0)}
.drawer-head{
  display:flex;align-items:center;justify-content:space-between;
  margin-bottom:25px;font-size:20px;font-weight:bold;
}
.close{background:var(--panel2);color:white;border:0;border-radius:10px;width:38px;height:38px;font-size:21px}
.section-title{
  color:var(--muted);font-size:12px;
  text-transform:uppercase;letter-spacing:1px;
  margin:22px 0 10px;
}
.setting{margin-bottom:16px}
.setting label{display:block;margin-bottom:8px;font-size:14px}
.setting select{
  width:100%;padding:12px;border-radius:12px;
  background:var(--panel2);color:white;
  border:1px solid var(--border);outline:none;
}
.toggle-row{
  display:flex;align-items:center;justify-content:space-between;
  padding:13px 0;
}
.switch{position:relative;width:48px;height:27px}
.switch input{opacity:0;width:0;height:0}
.track{
  position:absolute;inset:0;background:#555c78;
  border-radius:30px;transition:.2s;
}
.track:before{
  content:"";position:absolute;width:21px;height:21px;
  left:3px;top:3px;background:white;border-radius:50%;
  transition:.2s;
}
.switch input:checked+.track{background:var(--accent)}
.switch input:checked+.track:before{transform:translateX(21px)}
.history-item{
  width:100%;text-align:left;padding:12px;
  margin-bottom:7px;border:0;border-radius:11px;
  background:var(--panel2);color:white;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
}
.history-item.active{outline:1px solid var(--accent)}
.new-chat{
  width:100%;padding:12px;border:1px solid var(--border);
  border-radius:12px;background:var(--panel2);color:white;
}
@media(min-width:800px){
  .chat{padding:30px 6vw}
  .composer-wrap{padding-bottom:24px}
  .message{font-size:16px}
}
@media(max-width:500px){
  header{height:59px;padding:0 11px}
  .brand{font-size:17px}
  .chat{padding:16px 11px}
  .welcome h1{font-size:25px}
  .composer-wrap{padding:8px 9px 13px}
  .message{max-width:94%;font-size:14px}
}
</style>
</head>

<body>
<div class="app">
  <header>
    <div class="brand">
      <button class="icon-btn" onclick="menuAc()" aria-label="Menüyü aç">☰</button>
      🤖 ÖMER AI
    </div>
    <div class="header-actions">
      <button class="icon-btn" onclick="yeniSohbet()" title="Yeni sohbet">＋</button>
    </div>
  </header>

  <main class="chat" id="chat">
    <div class="welcome" id="welcome">
      <div class="robot">🤖</div>
      <h1>Merhaba! Ben ÖMER AI</h1>
      <p>Bugün sana nasıl yardımcı olabilirim?</p>
    </div>
  </main>

  <div class="composer-wrap">
    <div class="composer">
      <button class="tool" onclick="dosyaSec()" title="Görsel ekle">＋</button>
      <input type="file" id="dosya" accept="image/jpeg,image/png,image/webp">
      <textarea id="mesaj" placeholder="ÖMER AI'ye bir şey sor..." rows="1"></textarea>
      <button class="tool" onclick="mikrofon()" title="Sesle yaz">🎙️</button>
      <button class="send" onclick="gonder()" title="Gönder">➤</button>
    </div>
    <div class="hint">ÖMER AI bazen hata yapabilir. Önemli bilgileri kontrol et.</div>
  </div>
</div>

<div class="overlay" id="overlay" onclick="menuKapat()"></div>

<aside class="drawer" id="drawer">
  <div class="drawer-head">
    <span>⚙️ Ayarlar</span>
    <button class="close" onclick="menuKapat()">×</button>
  </div>

  <button class="new-chat" onclick="yeniSohbet();menuKapat()">＋ Yeni sohbet</button>

  <div class="section-title">Kişiselleştirme</div>

  <div class="setting">
    <label for="dil">🌍 Konuşma dili</label>
    <select id="dil">
      <option value="Türkçe">Türkçe</option>
      <option value="English">English</option>
      <option value="Deutsch">Deutsch</option>
      <option value="ไทย">ไทย</option>
      <option value="עברית">עברית</option>
      <option value="हिन्दी">हिन्दी</option>
      <option value="日本語">日本語</option>
      <option value="中文">中文</option>
      <option value="한국어">한국어</option>
      <option value="Português">Português</option>
      <option value="Español">Español</option>
      <option value="Русский">Русский</option>
      <option value="Français">Français</option>
      <option value="Italiano">Italiano</option>
      <option value="العربية">العربية</option>
    </select>
  </div>

  <div class="setting">
    <label for="kisilik">🎭 Asistan kişiliği</label>
    <select id="kisilik">
      <option value="arkadas">Arkadaş canlısı</option>
      <option value="komik">Eğlenceli</option>
      <option value="ogretmen">Öğretmen</option>
      <option value="ciddi">Ciddi</option>
    </select>
  </div>

  <div class="section-title">Ses ayarları</div>
  <div class="toggle-row">
    <span>🔊 Sesli cevap</span>
    <label class="switch">
      <input type="checkbox" id="sesli">
      <span class="track"></span>
    </label>
  </div>

  <div class="section-title">Sohbet geçmişi</div>
  <div id="gecmisListesi"></div>
</aside>

<script>
const API_URL = "https://omer-ai-server.onrender.com";

const chat = document.getElementById("chat");
const mesajKutusu = document.getElementById("mesaj");
const dosyaInput = document.getElementById("dosya");

let sohbetler = [];
let aktifSohbet = null;
let seciliGorsel = null;
let istekDevamEdiyor = false;

try {
  sohbetler = JSON.parse(localStorage.getItem("omerSohbetler") || "[]");
} catch {
  sohbetler = [];
}

if (!Array.isArray(sohbetler)) sohbetler = [];

function kaydet() {
  localStorage.setItem("omerSohbetler", JSON.stringify(sohbetler));
}

function menuAc() {
  document.getElementById("drawer").classList.add("open");
  document.getElementById("overlay").classList.add("open");
}

function menuKapat() {
  document.getElementById("drawer").classList.remove("open");
  document.getElementById("overlay").classList.remove("open");
}

function yeniSohbet() {
  aktifSohbet = {
    id: Date.now(),
    baslik: "Yeni sohbet",
    messages: []
  };

  sohbetler.unshift(aktifSohbet);
  kaydet();
  sohbetiGoster();
  gecmisiGoster();
  mesajKutusu.focus();
}

function sohbetiGoster() {
  chat.innerHTML = "";

  if (!aktifSohbet || aktifSohbet.messages.length === 0) {
    const welcome = document.createElement("div");
    welcome.className = "welcome";
    welcome.innerHTML = `
      <div class="robot">🤖</div>
      <h1>Merhaba! Ben ÖMER AI</h1>
      <p>Bugün sana nasıl yardımcı olabilirim?</p>
    `;
    chat.appendChild(welcome);
    return;
  }

  aktifSohbet.messages.forEach(m => mesajEkle(m.metin, m.rol, false));
  chat.scrollTop = chat.scrollHeight;
}

function mesajEkle(metin, rol, kaydetMesaj = true) {
  const welcome = document.getElementById("welcome");
  if (welcome) welcome.remove();

  const div = document.createElement("div");
  div.className = "message " + (rol === "user" ? "user" : "bot");
  div.textContent = metin;
  chat.appendChild(div);
  chat.scrollTop = chat.scrollHeight;

  if (kaydetMesaj && aktifSohbet) {
    aktifSohbet.messages.push({ rol, metin });
    if (rol === "user" && aktifSohbet.baslik === "Yeni sohbet") {
      aktifSohbet.baslik = metin.slice(0, 32);
    }
    kaydet();
    gecmisiGoster();
  }

  return div;
}

function gecmisiGoster() {
  const alan = document.getElementById("gecmisListesi");
  alan.innerHTML = "";

  sohbetler.slice(0, 30).forEach(s => {
    const satir = document.createElement("div");
    satir.style.display = "flex";
    satir.style.gap = "5px";
    satir.style.marginBottom = "7px";

    const btn = document.createElement("button");
    btn.className = "history-item";
    btn.style.flex = "1";
    btn.style.marginBottom = "0";
    btn.classList.toggle("active", aktifSohbet?.id === s.id);
    btn.textContent = "💬 " + (s.baslik || "Sohbet");

    btn.onclick = () => {
      aktifSohbet = s;
      sohbetiGoster();
      gecmisiGoster();
      menuKapat();
    };

    const sil = document.createElement("button");
    sil.textContent = "🗑️";
    sil.title = "Sohbeti sil";
    sil.style.cssText = `
      border:0;
      border-radius:11px;
      background:#343047;
      color:white;
      padding:0 12px;
      font-size:17px;
    `;

    sil.onclick = () => {
      if (!confirm("Bu sohbeti silmek istediğine emin misin?")) return;

      sohbetler = sohbetler.filter(x => x.id !== s.id);

      if (aktifSohbet?.id === s.id) {
        aktifSohbet = null;
        sohbetiGoster();
      }

      kaydet();
      gecmisiGoster();
    };

    satir.appendChild(btn);
    satir.appendChild(sil);
    alan.appendChild(satir);
  });
  }

function dosyaSec() {
  dosyaInput.click();
}

dosyaInput.addEventListener("change", () => {
  const file = dosyaInput.files[0];
  if (!file) return;

  if (!["image/jpeg", "image/png", "image/webp"].includes(file.type)) {
    alert("JPG, PNG veya WEBP görseli seçebilirsin.");
    dosyaInput.value = "";
    return;
  }

  if (file.size > 8 * 1024 * 1024) {
    alert("Görsel en fazla 8 MB olabilir.");
    dosyaInput.value = "";
    return;
  }

  const reader = new FileReader();
  reader.onload = () => {
    const base64 = String(reader.result).split(",")[1];
    seciliGorsel = {
      base64,
      mimeType: file.type
    };
    mesajKutusu.placeholder = "Görsel eklendi. Mesajını yaz...";
  };
  reader.readAsDataURL(file);
});

async function gonder() {
  if (istekDevamEdiyor) return;

  const metin = mesajKutusu.value.trim();
  if (!metin && !seciliGorsel) return;

  if (!aktifSohbet) yeniSohbet();

  const gorsel = seciliGorsel;
  const gonderilenMetin = metin || "Bu görseli incele.";

  const oncekiMesajlar = aktifSohbet.messages.slice(-20);

  mesajEkle(gonderilenMetin + (gorsel ? "\n📎 Görsel eklendi" : ""), "user");

  mesajKutusu.value = "";
  mesajKutusu.style.height = "42px";
  seciliGorsel = null;
  dosyaInput.value = "";
  mesajKutusu.placeholder = "ÖMER AI'ye bir şey sor...";

  istekDevamEdiyor = true;
  const bekleme = mesajEkle("ÖMER AI düşünüyor...", "bot");
  bekleme.classList.add("typing");

  try {
    const response = await fetch(API_URL + "/api/chat", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        mesaj: gonderilenMetin,
        dilAdi: document.getElementById("dil").value,
        kisilik: document.getElementById("kisilik").value,
        gecmis: oncekiMesajlar,
        imageBase64: gorsel?.base64 || null,
        imageMimeType: gorsel?.mimeType || null
      })
    });

    const data = await response.json();
    bekleme.remove();

    if (!response.ok) {
      throw new Error(data.hata || "Sunucu hatası: " + response.status);
    }

    if (!data.cevap) throw new Error("Cevap alınamadı.");

    mesajEkle(data.cevap, "bot");

    if (document.getElementById("sesli").checked) {
      seslendir(data.cevap);
    }

  } catch (error) {
    bekleme.remove();
    mesajEkle("Hata: " + error.message, "bot");
  } finally {
    istekDevamEdiyor = false;
  }
}

function seslendir(metin) {
  if (!("speechSynthesis" in window)) return;

  speechSynthesis.cancel();

  const konusma = new SpeechSynthesisUtterance(metin);
  const dil = document.getElementById("dil").value;

  const kodlar = {
    "Türkçe":"tr-TR",
    "English":"en-US",
    "Deutsch":"de-DE",
    "ไทย":"th-TH",
    "עברית":"he-IL",
    "हिन्दी":"hi-IN",
    "日本語":"ja-JP",
    "中文":"zh-CN",
    "한국어":"ko-KR",
    "Português":"pt-PT",
    "Español":"es-ES",
    "Русский":"ru-RU",
    "Français":"fr-FR",
    "Italiano":"it-IT",
    "العربية":"ar-SA"
  };

  konusma.lang = kodlar[dil] || "tr-TR";
  konusma.rate = 1;
  speechSynthesis.speak(konusma);
}

function mikrofon() {
  const SpeechRecognition =
    window.SpeechRecognition || window.webkitSpeechRecognition;

  if (!SpeechRecognition) {
    alert("Bu tarayıcı sesle yazmayı desteklemiyor.");
    return;
  }

  const tanima = new SpeechRecognition();
  const kodlar = {
    "Türkçe":"tr-TR","English":"en-US","Deutsch":"de-DE",
    "ไทย":"th-TH","עברית":"he-IL","हिन्दी":"hi-IN",
    "日本語":"ja-JP","中文":"zh-CN","한국어":"ko-KR",
    "Português":"pt-PT","Español":"es-ES","Русский":"ru-RU",
    "Français":"fr-FR","Italiano":"it-IT","العربية":"ar-SA"
  };

  tanima.lang = kodlar[document.getElementById("dil").value] || "tr-TR";
  tanima.interimResults = false;
  tanima.onresult = event => {
    mesajKutusu.value += event.results[0][0].transcript;
    mesajKutusu.focus();
  };
  tanima.onerror = () => alert("Mikrofon kullanılamadı.");
  tanima.start();
}

mesajKutusu.addEventListener("input", () => {
  mesajKutusu.style.height = "42px";
  mesajKutusu.style.height = Math.min(mesajKutusu.scrollHeight, 150) + "px";
});

mesajKutusu.addEventListener("keydown", event => {
  if (event.key === "Enter" && !event.shiftKey) {
    event.preventDefault();
    gonder();
  }
});

// İlk kullanımda sesli cevap kapalı.
const sesliAyar = document.getElementById("sesli");
sesliAyar.checked = localStorage.getItem("omerSesliCevap") === "true";

sesliAyar.addEventListener("change", () => {
  localStorage.setItem("omerSesliCevap", String(sesliAyar.checked));
});

const kayitliDil = localStorage.getItem("omerDil");
if (kayitliDil) document.getElementById("dil").value = kayitliDil;

document.getElementById("dil").addEventListener("change", event => {
  localStorage.setItem("omerDil", event.target.value);
});

const kayitliKisilik = localStorage.getItem("omerKisilik");
if (kayitliKisilik) document.getElementById("kisilik").value = kayitliKisilik;

document.getElementById("kisilik").addEventListener("change", event => {
  localStorage.setItem("omerKisilik", event.target.value);
});

if (sohbetler.length) {
  aktifSohbet = sohbetler[0];
}

sohbetiGoster();
gecmisiGoster();
</script>
</body>
</html>
