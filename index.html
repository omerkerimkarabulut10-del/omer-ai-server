body{background:var(--bg);color:var(--tx);font:16px/1.5 system-ui,-apple-system,sans-serif;display:flex;overflow:hidden}

body{padding:env(safe-area-inset-top) env(safe-area-inset-right) 0 env(safe-area-inset-left)}

<script>
const OMER_LOGO_SVG = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">

    <circle cx="143" cy="68" r="3" fill="#fbbf24" stroke="none"/>

  </g>
</svg>`;

document.getElementById('sb-logo').innerHTML = OMER_LOGO_SVG;
document.getElementById('wel-logo').innerHTML = OMER_LOGO_SVG;

(function initPWA() {
  const iconSvg = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
    <defs>
      <radialGradient id="bg" cx="35%" cy="30%" r="75%">
        <stop offset="0%" stop-color="#112240"/>
        <stop offset="100%" stop-color="#05050f"/>
      </radialGradient>
    </defs>
    <rect width="512" height="512" rx="112" fill="url(#bg)"/>
    <g transform="translate(56,56) scale(2)">
      ${OMER_LOGO_SVG.replace(/<svg[^>]*>|<\/svg>/g, '')}
    </g>
  </svg>`;

  const img = new Image();
  img.onload = () => {
    const makeIcon = (size) => {
      const c = document.createElement('canvas');
      c.width = c.height = size;
      c.getContext('2d').drawImage(img, 0, 0, size, size);
      return c.toDataURL('image/png');
    };
    const icon192 = makeIcon(192);
    const icon512 = makeIcon(512);
    document.getElementById('pwa-icon').href = icon192;
    document.getElementById('pwa-apple-icon').href = icon192;

    const manifest = {
      name: 'ÖMER AI Ultimate',
      short_name: 'ÖMER AI',
      description: 'Ultimate Yapay Zekâ & Stüdyo',
      start_url: './',
      scope: './',
      display: 'standalone',
      orientation: 'any',
      background_color: '#05050f',
      theme_color: '#05050f',
      icons: [
               { src: icon192, sizes: '192x192', type: 'image/png', purpose: 'any maskable' },
        { src: icon512, sizes: '512x512', type: 'image/png', purpose: 'any maskable' }
      ]
    };
    const manifestBlob = new Blob([JSON.stringify(manifest)], { type: 'application/manifest+json' });
    document.getElementById('pwa-manifest').href = URL.createObjectURL(manifestBlob);
  };
  img.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(iconSvg);

  if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
    const swCode = `
      const CACHE = 'omer-ai-v4';
      self.addEventListener('install', e => { self.skipWaiting(); });
      self.addEventListener('activate', e => { e.waitUntil(clients.claim()); });
      self.addEventListener('fetch', e => {
        if (e.request.method !== 'GET') return;
        e.respondWith(fetch(e.request).catch(() => caches.match(e.request)));
      });
    `;
    const swUrl = URL.createObjectURL(new Blob([swCode], { type: 'application/javascript' }));
    navigator.serviceWorker.register(swUrl).catch(() => {});
  }
})();

const $=s=>document.querySelector(s),K='omer_ai_v3',TONES=['Arkadaş canlısı','Profesyonel','Kısa & net'];
const MODES={
  chat:['💬','Yapay Zekâ Sohbet','Sohbet',"ÖMER AI'ye bir mesaj yazın...",'Akıllı Sohbet & Araştırma','Sorular sorun, araştırma yapın, kod yazın ve projelerinizi tek sohbetten geliştirin.']
};
const STUDIO_META={};

let S={chats:[],cur:null,mode:'chat',tone:TONES[0],mem:[],search:true,tts:false,fs:16,lang:'auto'},img=null,busy=false,rec=null;
try{Object.assign(S,JSON.parse(localStorage.getItem(K)||'{}'))}catch(e){}
if(!MODES[S.mode])S.mode='chat';
const save=()=>{try{S.chats=S.chats.slice(0,100);localStorage.setItem(K,JSON.stringify(S))}catch(e){}};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

function stripLatex(str){
  let out = String(str || '');
  out = out
    .replace(/\\begin\{[a-zA-Z0-9*]+\}/g, '')
    .replace(/\\end\{[a-zA-Z0-9*]+\}/g, '')
    .replace(/\\\[|\\\]|\\\(|\\\)|\$\$/g, '');

  for(let i=0; i<10; i++){
    const next = out
      .replace(/\\(?:frac|dfrac|tfrac|cfrac)\s*\{([^{}]+)\}\s*\{([^{}]+)\}/g, '($1 / $2)')
      .replace(/\\sqrt\s*\[([^\]]+)\]\s*\{([^{}]+)\}/g, '($1. kok: $2)')
      .replace(/\\sqrt\s*\{([^{}]+)\}/g, 'karekok($1)')
      .replace(/\\(?:text|mathrm|mathbf|mathit|mathsf|mathtt|operatorname|textbf|textit|textrm|emph)\s*\{([^{}]+)\}/g, '$1')
      .replace(/\^\{([^{}]+)\}/g, '^($1)')
      .replace(/_\{([^{}]+)\}/g, '_($1)');
    if(next === out) break;
    out = next;
  }

  const symMap = {
    '\\zeta':'ζ', '\\eta':'η', '\\gamma':'γ', '\\Gamma':'Γ', '\\lambda':'λ', '\\Lambda':'Λ',
    '\\pi':'π', '\\Pi':'Π', '\\alpha':'α', '\\beta':'β', '\\delta':'δ', '\\Delta':'Δ',
    '\\epsilon':'ε', '\\varepsilon':'ε', '\\theta':'θ', '\\mu':'μ', '\\nu':'ν', '\\xi':'ξ',
    '\\rho':'ρ', '\\sigma':'σ', '\\Sigma':'Σ', '\\tau':'τ', '\\phi':'φ', '\\varphi':'φ',
    '\\psi':'ψ', '\\omega':'ω', '\\Omega':'Ω', '\\infty':'∞', '\\sum':'Σ', '\\prod':'Π',
    '\\int':'∫', '\\partial':'∂', '\\nabla':'∇', '\\cdot':'·', '\\times':'×', '\\div':'÷',
    '\\pm':'±', '\\mp':'∓', '\\leq':'≤', '\\geq':'≥', '\\neq':'≠', '\\approx':'≈',
    '\\equiv':'≡', '\\sim':'~', '\\rightarrow':'→', '\\leftarrow':'←', '\\Rightarrow':'⇒',
    '\\Leftarrow':'⇐', '\\left':'', '\\right':'', '\\Bigl':'', '\\Bigr':'', '\\bigl':'', '\\bigr':'',
    '\\qquad':' ', '\\quad':' ', '\\!':'', '\\,':' ', '\\;':' ', '\\\\':'\n'
  };
  for(const [k,v] of Object.entries(symMap)){
    out = out.split(k).join(v);
  }

  out = out
    .replace(/\\[a-zA-Z]+/g, '')
    .replace(/\\/g, '')
    .replace(/&/g, ' ')
    .replace(/\[[0-9.]+\s*(?:pt|em|ex|cm|mm)\]/g, '')
    .replace(/[{}]/g, '')
    .replace(/[ \t]{2,}/g, ' ');

  return out;
 }

function code(l,c){
  const h=/^(html|htm)$/i.test(l)||/^\s*<!doctype html/i.test(c)||/<html[\s>]/i.test(c)||/<canvas[\s>]/i.test(c);
  return `<div class="cb"><div class="ch"><span>${esc(l||'kod')}</span><span><button type="button" data-a="copy">Kopyala</button>${h?'<button type="button" data-a="dl">İndir</button><button type="button" class="run" data-a="run">▶ Çalıştır</button>':''}</span></div><pre><code>${esc(c)}</code></pre></div>`;
}

function md(t){
  const B=[];
  t=String(t||'').replace(/```([\w+-]*)\n?([\s\S]*?)```/g,(_,l,c)=>(B.push(code(l,c.replace(/\n$/,''))),'\u0001'+(B.length-1)+'\u0001'));
  t=stripLatex(t);
  t=esc(t)
    .replace(/`([^`\n]+)`/g,'<code>$1</code>')
    .replace(/\*\*([^*\n]+)\*\*/g,'<b>$1</b>')
    .replace(/^#{1,6}\s*(.+)$/gm,'<h4>$1</h4>')
    .replace(/^[-*•]\s+(.+)$/gm,'<li>$1</li>')
    .replace(/\[([^\]]+)\]\((https?:[^)\s]+)\)/g,'<a href="$2" target="_blank" rel="noopener">$1</a>')
        .replace(/[*#~`$?]/g,'')
    .replace(/\n/g,'<br>');
  return t.replace(/\u0001(\d+)\u0001/g,(_,i)=>B[i]);
}

function normalizeSources(d){
  const raw = d?.sources || d?.citations || d?.webSources || d?.searchResults || d?.results || [];
  if(!Array.isArray(raw)) return [];
  const seen = new Set();
  return raw.map(item=>{
    if(typeof item === 'string') return { u: item, t: item };
    const u = item.u || item.url || item.link || item.uri || '';
    const t = item.t || item.title || item.name || item.source || '';
    return u ? { u: String(u), t: String(t || 'Kaynak') } : null;
  }).filter(item=>{
    if(!item) return false;
    try {
      const parsed = new URL(item.u);
      if(!['http:','https:'].includes(parsed.protocol) || seen.has(parsed.href)) return false;
      seen.add(parsed.href);
      return true;
    } catch(e) { return false; }
  }).slice(0,10);
}

function stripAnswerLinks(text){
  const blocks = [];
  let out = String(text || '').replace(/```[\s\S]*?```/g, block=>{
    blocks.push(block);
    return `\u0002${blocks.length-1}\u0002`;
  });
  out = out
    .replace(/\[([^\]]+)\]\((https?:\/\/[^)]+)\)/gi, '$1')
    .replace(/https?:\/\/[^\s<>()]+/gi, '')
    .replace(/[ \t]{2,}/g, ' ')
    .replace(/\s+([.,;:])/g, '$1');
  return out.replace(/\u0002(\d+)\u0002/g, (_, i)=>blocks[Number(i)]);
}

function renderSrc(srcs){
  if(!srcs || !srcs.length) return '';
  return '<div class="src"><div class="src-title">Kaynaklar (' + (srcs.length >= 5 ? '5+' : srcs.length) + ')</div>' + srcs.map(s=>{
    let host = '';
    try { host = new URL(s.u).hostname.replace(/^www\./,''); } catch(e) {}
    const fav = host ? `https://www.google.com/s2/favicons?domain=${encodeURIComponent(host)}&sz=64` : '';
    const letter = (host || s.t || 'W').charAt(0).toUpperCase();
    const label = s.t || host || 'Kaynak';
    return `<a href="${esc(s.u)}" target="_blank" rel="noopener noreferrer"><span class="site-logo">${fav?`<img src="${fav}" alt="${esc(host)}" loading="lazy" onerror="this.remove()">`:''}<span>${esc(letter)}</span></span><span class="stitle">${esc(label)}</span></a>`;
  }).join('') + '</div>';
}

function shouldShowSearch(text){
  const t=String(text||'').trim().toLocaleLowerCase('tr-TR');
  if(!t || t.length<4)return false;
  if(/^(merhaba|selam|sa|as|hey|hi|hello|günaydın|iyi akşamlar|iyi geceler|nasılsın|naber|teşekkürler|sağol|eyvallah|tamam|tmm|okey|ok|güle güle|bay bay)[.!?\s]*$/i.test(t))return false;
  if(/^(hatırla|remember)[:,\s]/i.test(t))return false;
  return /(araştır|internette ara|web.?arama|kaynak|güncel|son dakika|en son|bugün|şu an|şimdi|haber|fiyat|kaç tl|ne zaman|fikstür|maç|skor|puan durumu|hava durumu|deprem|kim kazandı|nedir|kimdir|nasıl çalışır)/i.test(t) || t.split(/\s+/).length>=4 || /[?？]/.test(t);
}

async function sendWithText(customText){
  const t = typeof customText === 'string' ? customText.trim() : $('#in').value.trim();
  if((!t&&!img)||busy)return;
  let c=cur();
  if(!c) c=newChat(true);
  if(/^(hatırla|remember)[:,\s]/i.test(t))S.mem=[...S.mem,t.replace(/^(hatırla|remember)[:,\s]*/i,'')].slice(-30);
  S.mode='chat';c.mode='chat';
  if(!c.msgs.length)c.title=(t||tt('Görsel analizi')).slice(0,30);
  c.msgs.push({r:'user',t:t||tt('Bu görseli detaylıca analiz et.'),img:!!img});

  const cleanDirective = 'FORMAT RULE: Never use LaTeX syntax or commands (no \\[, \\], \\(, \\), $$, \\frac, \\sum, \\int, \\begin, \\end, \\zeta, \\infty, etc.) and never use raw markdown symbols like #, ##, ###, *, **, ***, or ? in text responses. Write mathematical expressions and formulas in plain readable text with normal symbols like /, ^, =, +, -, and Unicode signs like π, Σ, ∞, √.';
  const historyMsgs = c.msgs.filter(x=>!x.t.startsWith('⚠️')).slice(-20).map(x=>({role:x.r==='user'?'user':'model',text:x.t}));
  historyMsgs.unshift({role:'user',text:cleanDirective});

  const p={mode:S.mode,tone:S.tone,searchEnabled:S.search!==false,lang:S.lang,memory:S.mem,messages:historyMsgs};

  const hadImage=!!img;
  if(img)p.image=img;img=null;$('#prev').innerHTML='';
  if(!customText){$('#in').value='';fit();}
  const ai={r:'ai',t:'',load:true};c.msgs.push(ai);busy=true;$('#go').disabled=true;
  const status=$('#search-status');
  const likelySearch=S.search!==false && shouldShowSearch(t) && !hadImage;
  status.classList.toggle('on',likelySearch);render();
  try{const r=await fetch('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(p)});
   const d=await r.json();if(!r.ok)throw new Error(d.error||'Sunucu hatası');ai.t=stripLatex(d.text||'');ai.src=normalizeSources(d);if(d.webSearch?.error)ai.searchError=d.webSearch.error}
  catch(e){ai.t='⚠️ '+e.message}
  delete ai.load;busy=false;$('#go').disabled=false;status.classList.remove('on');save();render();
  if(S.tts&&window.speechSynthesis&&ai.t&&!ai.t.startsWith('⚠️')){speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(stripLatex(ai.t).replace(/```[\s\S]*?```/g,' kod bloğu ').replace(/[*#`?$]/g,''));u.lang=vl();speechSynthesis.speak(u)}
}

function send(){return sendWithText();}

function setMode(){S.mode='chat';save();render();closeSb();$('#in').focus()}

document.addEventListener('click',e=>{
 const h=e.target.closest('[data-h]');if(h){if(swd)return;S.cur=+h.dataset.h;const found=cur();if(found)S.mode=found.mode||'chat';save();render();closeSb();return}
 const b=e.target.closest('[data-a]');if(!b)return;const cd=b.closest('.cb').querySelector('code').textContent,a=b.dataset.a;
 if(a==='copy'){navigator.clipboard.writeText(cd);b.textContent=tt('✓ Kopyalandı')}
 if(a==='run'){$('#fr').srcdoc=cd;$('#pv').style.display='flex'}
 if(a==='dl'){const l=document.createElement('a');l.href=URL.createObjectURL(new Blob([cd],{type:'text/html'}));l.download='proje.html';l.click()}});

$('#cl').onclick=()=>{$('#pv').style.display='none';$('#fr').srcdoc=''};
const closeSb=()=>$('#sb').classList.remove('o');
let touchStartX=0,touchStartY=0;
document.addEventListener('touchstart',e=>{const t=e.touches[0];touchStartX=t.clientX;touchStartY=t.clientY},{passive:true});
document.addEventListener('touchend',e=>{const t=e.changedTouches[0],dx=t.clientX-touchStartX,dy=t.clientY-touchStartY;if(innerWidth<=900&&Math.abs(dx)>65&&Math.abs(dx)>Math.abs(dy)){if(dx>0&&touchStartX<35)$('#sb').classList.add('o');else if(dx<0&&$('#sb').classList.contains('o'))closeSb()}},{passive:true});
$('#burger').onclick=e=>{e.stopPropagation();$('#sb').classList.toggle(innerWidth>900?'c':'o')};
$('#bk').onclick=closeSb;
$('#sb').addEventListener('click',e=>{e.stopPropagation()});

function delChat(id){S.chats=S.chats.filter(c=>c.id!==id);if(S.cur===id){S.cur=S.chats[0]?S.chats[0].id:null;if(S.cur)S.mode=cur().mode||'chat'}if(!cur())newChat(true);save();render()}
let sw=null,swd=false;
$('#hist').addEventListener('pointerdown',e=>{const h=e.target.closest('.hi');if(h){sw={h,x:e.clientX,y:e.clientY,dx:0};swd=false}});
addEventListener('pointermove',e=>{if(!sw)return;const dx=e.clientX-sw.x,dy=e.clientY-sw.y;
 if(!swd&&Math.abs(dx)>10&&Math.abs(dx)>Math.abs(dy))swd=true;
 if(swd){sw.dx=Math.min(0,dx);const s=sw.h.style;s.transition='none';s.transform=`translateX(${sw.dx}px)`;s.background=`rgba(239,68,68,${Math.min(.55,-sw.dx/200)})`}});
function swEnd(){if(!sw)return;const {h,dx}=sw;sw=null;if(swd){h.style.transition='transform .25s,opacity .25s,background .25s';
 if(dx<-90){h.style.transform='translateX(-110%)';h.style.opacity=0;setTimeout(()=>delChat(+h.dataset.h),230)}else{h.style.transform='';h.style.background=''}}
 setTimeout(()=>swd=false,60)}
addEventListener('pointerup',swEnd);addEventListener('pointercancel',swEnd);
document.addEventListener('pointerdown',e=>{const b=e.target.closest('button');if(!b||b.disabled)return;const r=b.getBoundingClientRect(),s=Math.max(r.width,r.height),d=document.createElement('span');
 d.className='rp';d.style.cssText=`width:${s}px;height:${s}px;left:${e.clientX-r.left-s/2}px;top:${e.clientY-r.top-s/2}px`;b.appendChild(d);setTimeout(()=>d.remove(),600)});

function startFreshChat(e){
  if(e) e.stopPropagation();
  newChat(true);
  render();
  closeSb();
  $('#in').focus();
}
$('#new').onclick=startFreshChat;


function dlg(t,b,btns){$('#dgt').textContent=t;$('#dgb').textContent=b;$('#dgs').innerHTML='';
 btns.forEach(([l,f,p])=>{const x=document.createElement('button');x.type='button';x.textContent=l;if(p)x.className='pr';x.onclick=()=>{$('#dg').style.display='none';f&&f()};$('#dgs').appendChild(x)});$('#dg').style.display='flex';trAll()}
function clearAll(){dlg('Sohbet geçmişi','Tüm sohbetler silinsin mi?',[['Vazgeç',settings],['Hepsini sil',()=>{S.chats=[];S.cur=null;newChat(true);save();render()},1]])}
function clearMem(){dlg('Hafıza','Kayıtlı tüm notlar silinsin mi?',[['Vazgeç',settings],['Sil',()=>{S.mem=[];save()},1]])}
function applyFs(){$('#msgs').style.fontSize=$('#in').style.fontSize=S.fs+'px'}
function settings(){const o=(a,v)=>a.map(x=>`<option value="${x}"${x==v?' selected':''}>${x}</option>`).join('');
 dlg('⚙️ Ayarlar','',[['Hafızayı sil',clearMem],['Geçmişi sil',clearAll],['Tamam',null,1]]);
 $('#dgb').innerHTML=`<label class="sr">Dil / Language<select id="s0">${LGS.map(([k,n])=>`<option value="${k}"${k==S.lang?' selected':''}>${n}</option>`).join('')}</select></label><label class="sr">Ton<select id="s1">${o(TONES,S.tone)}</select></label><label class="sr">Web araması<input type="checkbox" id="s2"${S.search?' checked':''}></label><label class="sr">Yanıtı sesli oku<input type="checkbox" id="s3"${S.tts?' checked':''}></label><label class="sr">Yazı boyutu<select id="s4">${o(['Küçük','Normal','Büyük'],{14:'Küçük',16:'Normal',18:'Büyük'}[S.fs])}</select></label><div style="margin-top:10px;font-size:13px">${tt('Kayıtlı hafıza notu')}: ${S.mem.length}</div>`;
 $('#s0').onchange=e=>{S.lang=e.target.value;save();applyLang();render();settings()};
 $('#s1').onchange=e=>{S.tone=e.target.value;save();render()};
 $('#s2').onchange=e=>{S.search=e.target.checked;save()};
 $('#s3').onchange=e=>{S.tts=e.target.checked;if(!S.tts&&window.speechSynthesis)speechSynthesis.cancel();save()};
 $('#s4').onchange=e=>{S.fs={'Küçük':14,'Normal':16,'Büyük':18}[e.target.value];applyFs();save()};trAll()}
$('#menu').onclick=settings;
$('#tone').onclick=()=>{S.tone=TONES[(TONES.indexOf(S.tone)+1)%TONES.length];save();render()};
$('#memb').onclick=()=>S.mem.length?dlg('Hafıza','- '+S.mem.join('\n- '),[['Kapat'],['Hafızayı sil',()=>{S.mem=[];save()},1]]):dlg('Hafıza','Hafıza boş. Kaydetmek için mesaj kutusuna şunu yaz:\nhatırla: adım Ömer',[['Tamam',null,1]]);
$('#go').onclick=send;$('#in').oninput=fit;
$('#in').onkeydown=e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();send()}};
$('#att').onclick=()=>$('#file').click();
$('#file').onchange=e=>{const f=e.target.files[0];if(!f)return;const im=new Image,u=URL.createObjectURL(f);
 im.onload=()=>{const k=Math.min(1,1400/Math.max(im.width,im.height)),cv=document.createElement('canvas');cv.width=im.width*k;cv.height=im.height*k;
  cv.getContext('2d').drawImage(im,0,0,cv.width,cv.height);img={data:cv.toDataURL('image/jpeg',.88).split(',')[1],mime:'image/jpeg'};
  $('#prev').innerHTML=`<img src="${u}"><button type="button" onclick="img=null;$('#prev').innerHTML=''">✕</button>`};im.src=u;e.target.value=''};
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
$('#mic').onclick=()=>{if(!SR)return dlg('Ses tanıma','Bu tarayıcı sesle yazmayı desteklemiyor. Chrome ile açmayı dene.',[['Tamam',null,1]]);if(rec)return rec.stop();
 rec=new SR;rec.lang=vl();rec.interimResults=true;rec.onresult=e=>{$('#in').value=[...e.results].map(r=>r[0].transcript).join('');fit()};
 rec.onend=()=>{rec=null;$('#mic').classList.remove('on')};$('#mic').classList.add('on');rec.start()};
fetch('/api/health').then(r=>r.json()).then(d=>{if(!d.key){$('#st').innerHTML='<span class="dot off"></span>Anahtar yok';trAll()}}).catch(()=>{$('#st').innerHTML='<span class="dot off"></span>Çevrimdışı';trAll()});

applyFs();applyLang();if(!cur())newChat(true);else if(cur().msgs.length)newChat(true);render();
</script>
