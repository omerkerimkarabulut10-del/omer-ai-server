<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#101329">
<meta name="description" content="ÖMER AI - Akıllı sohbet asistanın">
<link rel="manifest" href="/manifest.json">
<title>ÖMER AI</title>

<style>
*{box-sizing:border-box}
:root{
 --bg:#101329;
 --panel:#191e38;
 --panel2:#222947;
 --line:#303957;
 --text:#f5f6ff;
 --muted:#a0a9c8;
 --accent:#55e1d0;
}
body{
 margin:0;background:var(--bg);color:var(--text);
 font-family:Arial,sans-serif;height:100dvh;overflow:hidden
}
button,textarea,input{font:inherit}
button{cursor:pointer}
.app{display:flex;height:100dvh}
.sidebar{
 width:290px;background:#151a30;border-right:1px solid var(--line);
 display:flex;flex-direction:column;padding:18px;gap:14px;
 transition:.3s;z-index:10
}
.brand{display:flex;align-items:center;gap:12px;margin-bottom:12px}
.brand img{width:48px;height:48px;border-radius:14px;object-fit:cover}
.brand h2{font-size:19px;margin:0}
.brand small{color:var(--muted)}
.new-chat{
 background:var(--accent);border:0;border-radius:13px;
 padding:14px;font-weight:bold;color:#10202a
}
.section-title{font-size:12px;color:var(--muted);margin-top:8px}
.history{overflow:auto;flex:1}
.history-item{
 display:flex;align-items:center;gap:7px;padding:11px;
 border-radius:10px;margin:5px 0;background:transparent;
 color:var(--text)
}
.history-item.active,.history-item:hover{background:var(--panel2)}
.history-title{
 flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;
 white-space:nowrap;border:0;background:none;color:inherit;text-align:left
}
.delete-chat{border:0;background:none;color:#ff8295}
.side-button{
 border:1px solid var(--line);background:var(--panel);
 color:var(--text);padding:12px;border-radius:11px;text-align:left
}
.main{flex:1;min-width:0;display:flex;flex-direction:column}
.topbar{
 height:65px;display:flex;align-items:center;gap:15px;
 padding:0 20px;border-bottom:1px solid var(--line)
}
.menu{
 width:42px;height:42px;background:var(--panel);
 border:1px solid var(--line);border-radius:12px;
 display:flex;flex-direction:column;justify-content:center;
 align-items:center;gap:5px
}
.menu span{width:19px;height:2px;background:white;border-radius:5px;transition:.3s}
.top-title{font-weight:bold}
.status{margin-left:auto;color:var(--muted);font-size:12px}
.chat-area{flex:1;overflow-y:auto;padding:22px 15px}
.chat-inner{max-width:850px;margin:auto;display:flex;flex-direction:column;gap:18px}
.welcome{text-align:center;margin:auto;padding:9vh 10px}
.welcome img{width:85px;height:85px;object-fit:cover;border-radius:24px}
.welcome h1{font-size:clamp(27px,5vw,40px)}
.welcome h1 span{color:var(--accent)}
.welcome p{color:var(--muted);line-height:1.6}
.suggestions{display:flex;flex-wrap:wrap;justify-content:center;gap:9px;margin-top:25px}
.suggestion{
 padding:11px;border:1px solid var(--line);border-radius:12px;
 background:var(--panel);color:var(--text)
}
.message{display:flex;gap:10px;animation:appear .25s ease}
.message.user{flex-direction:row-reverse}
.avatar{
 width:35px;height:35px;flex-shrink:0;border-radius:12px;
 background:var(--panel2);display:grid;place-items:center;
 font-size:11px;color:var(--accent);overflow:hidden
}
.avatar img{width:100%;height:100%;object-fit:cover}
.bubble{
 max-width:82%;padding:13px 15px;background:var(--panel);
 border:1px solid var(--line);border-radius:4px 15px 15px 15px;
 white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.6;font-size:14px
}
.user .bubble{background:#20434d;border-radius:15px 4px 15px 15px}
.bubble img{max-width:210px;max-height:180px;border-radius:10px;display:block;margin-bottom:8px}
.composer-wrap{padding:12px 15px 18px}
.composer{
 max-width:850px;margin:auto;display:flex;align-items:flex-end;gap:8px;
 padding:9px;background:var(--panel);border:1px solid var(--line);
 border-radius:17px
}
textarea{
 flex:1;min-width:0;resize:none;max-height:140px;min-height:40px;
 padding:10px;background:transparent;border:0;outline:0;color:white
}
textarea::placeholder{color:var(--muted)}
.tool{
 width:40px;height:40px;flex-shrink:0;border-radius:11px;
 border:1px solid var(--line);background:var(--panel2);color:white
}
.send{background:var(--accent);color:#10202a;font-weight:bold;border:0}
.hint{text-align:center;color:var(--muted);font-size:10px;margin-top:9px}
.overlay{
 position:fixed;inset:0;background:#0009;z-index:9;
 opacity:0;pointer-events:none;transition:.3s
}
.overlay.show{opacity:1;pointer-events:auto}
.modal-bg{
 display:none;position:fixed;inset:0;background:#000a;
 z-index:30;align-items:center;justify-content:center;padding:15px
}
.modal-bg.show{display:flex}
.modal{
 width:min(500px,100%);background:var(--panel);
 border:1px solid var(--line);border-radius:18px;padding:20px
}
.modal h2{margin-top:0}
.modal p{color:var(--muted);font-size:13px;line-height:1.5}
.modal textarea,.modal select{
 width:100%;background:var(--bg);border:1px solid var(--line);
 border-radius:10px;padding:12px;color:white;margin-top:8px
}
.modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:15px}
.modal-actions button{padding:10px 14px;border-radius:10px;border:1px solid var(--line);background:var(--panel2);color:white}
.modal-actions .primary{background:var(--accent);color:#10202a;border:0}
@keyframes appear{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
@media(max-width:850px){
 .sidebar{position:fixed;left:0;top:0;bottom:0;width:min(290px,85vw);transform:translateX(-105%);box-shadow:0 0 40px #0008}
 .sidebar.open{transform:translateX(0)}
 .topbar{height:60px;padding:0 13px}
 .chat-area{padding:15px 10px}
}
@media(min-width:851px){
 .app.closed .sidebar{width:0;padding:0;overflow:hidden;border:0}
}
@media(max-width:480px){
 .welcome{padding-top:6vh}
 .welcome img{width:70px;height:70px}
 .bubble{max-width:86%;font-size:13px}
 .composer{padding:6px}
 .tool{width:36px;height:36px}
}
</style>
</head>

<body>
<div class="app" id="app">

<aside class="sidebar" id="sidebar">
 <div class="brand">
  <img src="/icon-192.png" alt="ÖMER AI">
  <div><h2>ÖMER AI</h2><small>Akıllı sohbet asistanın</small></div>
 </div>

 <button class="new-chat" id="newChat">＋ Yeni sohbet</button>
 <div class="section-title">SOHBET GEÇMİŞİ</div>
 <div class="history" id="history"></div>

 <button class="side-button" id="memoryOpen">🧠 Hafızam</button>
 <button class="side-button" id="settingsOpen">⚙️ Ayarlar</button>
</aside>

<div class="overlay" id="overlay"></div>

<main class="main">
 <header class="topbar">
  <button class="menu" id="menuBtn" aria-label="Menü">
   <span></span><span></span><span></span>
  </button>
  <div class="top-title">ÖMER AI</div>
  <div class="status">● Çevrimiçi</div>
 </header>

 <section class="chat-area" id="chatArea">
  <div class="chat-inner" id="chatInner"></div>
 </section>

 <div class="composer-wrap">
  <div class="composer">
   <input type="file" id="imageInput" accept="image/png,image/jpeg,image/webp" hidden>
   <button class="tool" id="attachBtn">＋</button>
   <button class="tool" id="micBtn">🎙️</button>
   <textarea id="messageInput" rows="1" placeholder="ÖMER AI'a bir şey sor..."></textarea>
   <button class="tool send" id="sendBtn">➤</button>
  </div>
  <div class="hint">ÖMER AI bazen hata yapabilir. Önemli bilgileri kontrol et.</div>
 </div>
</main>
</div>

<div class="modal-bg" id="memoryModal">
 <div class="modal">
  <h2>🧠 ÖMER AI Hafızası</h2>
  <p>Buraya yazdığın bilgiler yeni sohbetlerde de kullanılabilir. Bu hafıza bu tarayıcıda saklanır.</p>
  <textarea id="memoryText" rows="7" placeholder="Örnek: Türkçe konuşmayı tercih ederim."></textarea>
  <div class="modal-actions">
   <button data-close="memoryModal">Kapat</button>
   <button class="primary" id="saveMemory">Kaydet</button>
  </div>
 </div>
</div>

<div class="modal-bg" id="settingsModal">
 <div class="modal">
  <h2>⚙️ Ayarlar</h2>
  <p>Dil ve kişilik ayarlarını seç.</p>
  <select id="languageSelect">
   <option>Türkçe</option><option>English</option><option>Deutsch</option>
   <option>العربية</option><option>Français</option><option>Español</option>
   <option>Русский</option><option>日本語</option><option>한국어</option>
   <option>中文</option><option>Italiano</option><option>Português</option>
   <option>Nederlands</option><option>فارسی</option><option>Azərbaycanca</option>
  </select>
  <select id="personalitySelect">
   <option value="arkadas">Arkadaş canlısı</option>
   <option value="resmi">Resmî</option>
   <option value="ogretmen">Öğretmen</option>
   <option value="kisa">Kısa ve net</option>
   <option value="eglenceli">Eğlenceli</option>
  </select>
  <p><label><input type="checkbox" id="voiceToggle"> Cevapları sesli oku</label></p>
  <div class="modal-actions">
   <button data-close="settingsModal">Kapat</button>
   <button class="primary" id="saveSettings">Kaydet</button>
  </div>
 </div>
</div>

<script>
const API_URL="https://omer-ai-server.onrender.com";
const $=id=>document.getElementById(id);
const KEY={
 chats:"omerSohbetlerV2",
 memory:"omerAIMemory",
 language:"omerAILanguage",
 personality:"omerAIPersonality",
 voice:"omerSesliCevap"
};

let chats=JSON.parse(localStorage.getItem(KEY.chats)||"[]");
let currentId=null,selectedImage=null,busy=false,recognition=null;

function saveChats(){localStorage.setItem(KEY.chats,JSON.stringify(chats))}
function getChat(){return chats.find(c=>c.id===currentId)}
function newId(){return Date.now().toString(36)+Math.random().toString(36).slice(2)}
function closeSidebar(){
 $("sidebar").classList.remove("open");
 $("overlay").classList.remove("show")
}
function toggleMenu(){
 if(innerWidth<=850){
  $("sidebar").classList.toggle("open");
  $("overlay").classList.toggle("show")
 }else{
  $("app").classList.toggle("closed")
 }
}
function openModal(id){$(id).classList.add("show")}
function closeModal(id){$(id).classList.remove("show")}
function scrollBottom(){
 requestAnimationFrame(()=>$("chatArea").scrollTop=$("chatArea").scrollHeight)
}
function addMessage(role,text,image=null){
 const wrap=document.createElement("div");
 wrap.className="message "+(role==="user"?"user":"assistant");
 const avatar=document.createElement("div");
 avatar.className="avatar";
 if(role==="user")avatar.textContent="SEN";
 else{
  const img=document.createElement("img");
  img.src="/icon-192.png";avatar.append(img)
 }
 const bubble=document.createElement("div");
 bubble.className="bubble";
 if(image){
  const img=document.createElement("img");
  img.src=image;bubble.append(img)
 }
 const content=document.createElement("div");
 content.textContent=text||"";
 bubble.append(content);wrap.append(avatar,bubble);
 $("chatInner").append(wrap);scrollBottom()
}
function welcome(){
 $("chatInner").innerHTML=`
 <div class="welcome">
  <img src="/icon-192.png" alt="ÖMER AI">
  <h1>Merhaba, ben <span>ÖMER AI</span></h1>
  <p>Sorularını cevaplamak, fikir üretmek ve yeni şeyler keşfetmek için buradayım.</p>
  <div class="suggestions">
   <button class="suggestion">Bana ilginç bir bilgi ver</button>
   <button class="suggestion">Bir oyun fikri bulalım</button>
   <button class="suggestion">Bir konuyu anlat</button>
  </div>
 </div>`;
 document.querySelectorAll(".suggestion").forEach(b=>b.onclick=()=>{
  $("messageInput").value=b.textContent;sendMessage()
 })
}
function renderChat(){
 const c=getChat();
 if(!c||!c.messages.length){welcome();return}
 $("chatInner").innerHTML="";
 c.messages.forEach(m=>addMessage(m.role,m.text,m.image));
}
function renderHistory(){
 $("history").innerHTML="";
 chats.sort((a,b)=>b.updated-a.updated);
 chats.forEach(c=>{
  const row=document.createElement("div");
  row.className="history-item"+(c.id===currentId?" active":"");
  const title=document.createElement("button");
  title.className="history-title";
  title.textContent=c.title||"Yeni sohbet";
  title.onclick=()=>{
   currentId=c.id;renderChat();renderHistory();closeSidebar()
  };
  const del=document.createElement("button");
  del.className="delete-chat";del.textContent="🗑️";
  del.onclick=()=>{
   if(confirm("Bu sohbet silinsin mi?")){
    chats=chats.filter(x=>x.id!==c.id);
    if(currentId===c.id)currentId=null;
    saveChats();renderHistory();renderChat()
   }
  };
  row.append(title,del);$("history").append(row)
 })
}
function ensureChat(){
 let c=getChat();
 if(!c){
  c={id:newId(),title:"Yeni sohbet",messages:[],updated:Date.now()};
  chats.unshift(c);currentId=c.id;saveChats()
 }
 return c
}
function speak(text){
 if(localStorage.getItem(KEY.voice)!=="true")return;
 if(!("speechSynthesis" in window))return;
 speechSynthesis.cancel();
 const utterance=new SpeechSynthesisUtterance(text);
 utterance.lang=localStorage.getItem(KEY.language)==="English"?"en-US":"tr-TR";
 speechSynthesis.speak(utterance)
}
async function sendMessage(){
 if(busy)return;
 const input=$("messageInput");
 const text=input.value.trim();
 if(!text&&!selectedImage)return;

 const c=ensureChat();
 const image=selectedImage;
 if(!c.messages.length)c.title=(text||"Görsel hakkında").slice(0,30);
 const userMessage={role:"user",text,image};
 c.messages.push(userMessage);c.updated=Date.now();
 input.value="";input.style.height="auto";
 selectedImage=null;$("imageInput").value="";
 addMessage("user",text,image);renderHistory();saveChats();

 busy=true;$("sendBtn").disabled=true;
 const typing=document.createElement("div");
 typing.className="message";typing.id="typing";
 typing.innerHTML='<div class="avatar">AI</div><div class="bubble">Yazıyor...</div>';
 $("chatInner").append(typing);scrollBottom();

 try{
  const payload={
   message:text,
   gecmis:c.messages.slice(-20).map(m=>({role:m.role,text:m.text||""})),
   hafiza:localStorage.getItem(KEY.memory)||"",
   dil:localStorage.getItem(KEY.language)||"Türkçe",
   kisilik:localStorage.getItem(KEY.personality)||"arkadas",
   image:image?image.split(",")[1]:null,
   imageMime:image?(image.match(/^data:(.*?);/)||[])[1]:""
  };
  const response=await fetch(API_URL+"/api/chat",{
   method:"POST",
   headers:{"Content-Type":"application/json"},
   body:JSON.stringify(payload)
  });
  const data=await response.json();
  if(!response.ok)throw new Error(data.error||"Sunucu hatası");
  const answer=data.answer||"Yanıt alınamadı.";
  c.messages.push({role:"assistant",text:answer});
  c.updated=Date.now();saveChats();
  $("typing")?.remove();addMessage("assistant",answer);speak(answer)
 }catch(error){
  const msg="Hata: "+error.message;
  c.messages.push({role:"assistant",text:msg});
  saveChats();$("typing")?.remove();addMessage("assistant",msg)
 }finally{
  busy=false;$("sendBtn").disabled=false;renderHistory()
 }
}
function startNewChat(){
 currentId=null;ensureChat();renderChat();renderHistory();closeSidebar()
}

$("menuBtn").onclick=toggleMenu;
$("overlay").onclick=closeSidebar;
$("newChat").onclick=startNewChat;
$("sendBtn").onclick=sendMessage;

$("messageInput").onkeydown=e=>{
 if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();sendMessage()}
};
$("messageInput").oninput=e=>{
 e.target.style.height="auto";
 e.target.style.height=Math.min(e.target.scrollHeight,140)+"px"
};

$("attachBtn").onclick=()=>$("imageInput").click();
$("imageInput").onchange=e=>{
 const file=e.target.files[0];if(!file)return;
 if(file.size>8*1024*1024){alert("Görsel en fazla 8 MB olabilir.");return}
 const reader=new FileReader();
 reader.onload=()=>{selectedImage=reader.result;alert("Görsel eklendi!")};
 reader.readAsDataURL(file)
};

$("micBtn").onclick=()=>{
 const Speech=window.SpeechRecognition||window.webkitSpeechRecognition;
 if(!Speech){alert("Bu tarayıcı sesle yazmayı desteklemiyor.");return}
 if(recognition){recognition.stop();recognition=null;return}
 recognition=new Speech();
 recognition.lang=localStorage.getItem(KEY.language)==="English"?"en-US":"tr-TR";
 recognition.onresult=e=>{
  $("messageInput").value+=($("messageInput").value?" ":"")+e.results[0][0].transcript
 };
 recognition.onend=()=>recognition=null;
 recognition.start()
};

$("memoryOpen").onclick=()=>{
 $("memoryText").value=localStorage.getItem(KEY.memory)||"";
 openModal("memoryModal");closeSidebar()
};
$("saveMemory").onclick=()=>{
 localStorage.setItem(KEY.memory,$("memoryText").value.trim());
 closeModal("memoryModal");alert("Hafıza kaydedildi!")
};

$("settingsOpen").onclick=()=>{
 $("languageSelect").value=localStorage.getItem(KEY.language)||"Türkçe";
 $("personalitySelect").value=localStorage.getItem(KEY.personality)||"arkadas";
 $("voiceToggle").checked=localStorage.getItem(KEY.voice)==="true";
 openModal("settingsModal");closeSidebar()
};
$("saveSettings").onclick=()=>{
 localStorage.setItem(KEY.language,$("languageSelect").value);
 localStorage.setItem(KEY.personality,$("personalitySelect").value);
 localStorage.setItem(KEY.voice,$("voiceToggle").checked?"true":"false");
 closeModal("settingsModal");alert("Ayarlar kaydedildi!")
};

document.querySelectorAll("[data-close]").forEach(b=>{
 b.onclick=()=>closeModal(b.dataset.close)
});
document.querySelectorAll(".modal-bg").forEach(m=>{
 m.onclick=e=>{if(e.target===m)closeModal(m.id)}
});

if("serviceWorker" in navigator){
 window.addEventListener("load",()=>navigator.serviceWorker.register("/sw.js").catch(()=>{}))
}

if(chats.length){currentId=chats[0].id;renderChat()}
else welcome();
renderHistory();
</script>
</body>
   </html>
