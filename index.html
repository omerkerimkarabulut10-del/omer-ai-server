
<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#101329">
<title>ÖMER AI</title>

<style>
*{box-sizing:border-box}
:root{
 --bg:#101329;
 --panel:#191e38;
 --text:#fff;
 --muted:#a7abc5;
 --accent:#7568ff;
 --line:#303653;
}
body.light{
 --bg:#f1f2fa;
 --panel:#fff;
 --text:#17182a;
 --muted:#666b82;
 --line:#dddfea;
}
html,body{margin:0;width:100%;height:100%;overflow:hidden}
body{
 background:var(--bg);
 color:var(--text);
 font-family:Arial,sans-serif;
 font-size:16px;
}
button,select,.filebtn{font:inherit}
header{
 height:72px;
 padding:12px 24px;
 display:flex;
 align-items:center;
 gap:14px;
 background:var(--panel);
 border-bottom:1px solid var(--line);
}
.logo{
 background:var(--accent);
 border-radius:14px;
 padding:10px;
 font-size:25px;
}
header h2{margin:0;font-size:23px}
header small{color:var(--muted);font-size:13px}
#historyToggle{display:none}
.layout{
 display:flex;
 width:100%;
 max-width:1600px;
 margin:auto;
 height:calc(100dvh - 72px);
}
.sidebar{
 width:280px;
 flex-shrink:0;
 background:var(--panel);
 border-right:1px solid var(--line);
 padding:18px;
 display:flex;
 flex-direction:column;
 min-height:0;
}
.newchat{width:100%;margin-bottom:18px}
#history{overflow-y:auto;flex:1}
.history-item{
 display:flex;
 align-items:center;
 gap:5px;
 margin:6px 0;
}
.history-open{
 flex:1;
 min-width:0;
 text-align:left;
 background:transparent;
 color:var(--text);
 overflow:hidden;
 text-overflow:ellipsis;
 white-space:nowrap;
}
.history-open.active{background:var(--line)}
.delete{background:transparent;color:#ff7777;padding:9px}
main{
 flex:1;
 min-width:0;
 max-width:1200px;
 margin:auto;
 padding:22px 30px;
 display:flex;
 flex-direction:column;
}
.settings{
 background:var(--panel);
 padding:14px 16px;
 border-radius:14px;
 margin-bottom:16px;
 display:flex;
 gap:12px;
 align-items:center;
 flex-wrap:wrap;
}
.settings label{color:var(--muted);font-size:14px}
select,button,.filebtn{
 background:var(--accent);
 color:white;
 border:0;
 border-radius:10px;
 padding:11px 15px;
 font-size:14px;
 cursor:pointer;
}
button:hover,.filebtn:hover{filter:brightness(1.12)}
button.secondary,.filebtn.secondary,select{
 background:var(--line);
 color:var(--text);
}
#messages{
 flex:1;
 min-height:0;
 overflow-y:auto;
 padding:12px 5px;
}
.msg{
 padding:15px 18px;
 margin:14px 0;
 border-radius:17px;
 max-width:85%;
 white-space:pre-wrap;
 overflow-wrap:anywhere;
 line-height:1.65;
 font-size:16px;
}
.user{background:var(--accent);margin-left:auto}
.bot{background:var(--panel);border:1px solid var(--line)}
.msg img{max-width:100%;border-radius:12px;margin-top:8px}
#status{color:var(--muted);font-size:13px;padding:7px}
.composer{
 background:var(--panel);
 border:1px solid var(--line);
 border-radius:18px;
 padding:13px;
}
textarea{
 width:100%;
 resize:vertical;
 max-height:180px;
 background:transparent;
 color:var(--text);
 border:0;
 outline:0;
 font:16px Arial;
 min-height:55px;
 padding:10px;
}
.actions{display:flex;gap:9px;align-items:center;flex-wrap:wrap}
#preview{
 max-width:120px;
 max-height:120px;
 display:none;
 margin:8px;
 border-radius:10px;
}
.typing{display:flex;gap:5px;align-items:center;padding:8px}
.typing span{
 width:8px;height:8px;
 background:var(--muted);
 border-radius:50%;
 animation:updown 1s infinite ease-in-out;
}
.typing span:nth-child(2){animation-delay:.15s}
.typing span:nth-child(3){animation-delay:.3s}
@keyframes updown{
 0%,60%,100%{transform:translateY(0);opacity:.5}
 30%{transform:translateY(-7px);opacity:1}
}
#overlay{display:none}

@media(min-width:1200px){
 main{padding:28px 42px}
 .msg{font-size:17px;max-width:80%}
 textarea{font-size:17px}
 .settings{padding:17px 20px}
}

@media(max-width:800px){
 header{height:64px;padding:9px 13px}
 header h2{font-size:20px}
 .layout{height:calc(100dvh - 64px)}
 .sidebar{
  position:fixed;
  z-index:20;
  top:64px;
  bottom:0;
  left:0;
  width:min(300px,85vw);
  transform:translateX(-105%);
  transition:transform .22s ease;
  box-shadow:8px 0 30px #0003;
 }
 body.show-sidebar .sidebar{transform:translateX(0)}
 #historyToggle{display:block;padding:9px 12px}
 #overlay{
  position:fixed;
  z-index:15;
  inset:64px 0 0;
  background:#0008;
 }
 body.show-sidebar #overlay{display:block}
 main{padding:12px;max-width:none}
 .settings{gap:8px;padding:11px}
 .settings label{font-size:13px}
 .settings select{max-width:100%;padding:9px;font-size:13px}
 .msg{max-width:94%;font-size:15px;padding:12px 14px}
}

@media(max-width:480px){
 header{gap:9px}
 header h2{font-size:18px}
 header small{font-size:11px}
 .logo{font-size:21px;padding:8px}
 main{padding:8px}
 .settings{gap:7px;padding:9px;margin-bottom:8px}
 .settings label{font-size:12px}
 .settings select{font-size:12px;padding:8px}
 .settings button{font-size:12px;padding:8px 10px}
 .settings input{margin:0 3px}
 #messages{padding:6px 2px}
 .msg{max-width:96%;font-size:15px;line-height:1.55}
 .composer{padding:9px;border-radius:14px}
 textarea{font-size:16px;min-height:48px}
 .actions{gap:6px}
 .actions button,.filebtn{padding:10px 11px;font-size:13px}
 #status{font-size:12px}
}

@media(max-height:550px) and (max-width:800px){
 .settings{max-height:95px;overflow-y:auto}
}
</style>
</head>

<body>
<header>
<button id="historyToggle" class="secondary" onclick="gecmisMenu()">☰</button>
<div class="logo">🤖</div>
<div>
<h2>ÖMER AI</h2>
<small>Akıllı sohbet asistanın</small>
</div>
</header>

<div id="overlay" onclick="gecmisMenu(false)"></div>

<div class="layout">
<aside class="sidebar">
<button class="newchat" onclick="yeniSohbet()">＋ Yeni sohbet</button>
<strong style="font-size:13px;color:var(--muted);margin:8px 0">SOHBET GEÇMİŞİ</strong>
<div id="history"></div>
</aside>

<main>
<div class="settings">
<label>Dil:</label>
<select id="language" onchange="dilKaydet()">
<option value="tr-TR">🇹🇷 Türkçe</option>
<option value="de-DE">🇩🇪 Almanca</option>
<option value="en-US">🇬🇧 İngilizce</option>
<option value="th-TH">🇹🇭 Tayca</option>
<option value="he-IL">🇮🇱 İbranice</option>
<option value="hi-IN">🇮🇳 Hintçe</option>
<option value="ja-JP">🇯🇵 Japonca</option>
<option value="zh-CN">🇨🇳 Çince</option>
<option value="ko-KR">🇰🇷 Korece</option>
<option value="pt-PT">🇵🇹 Portekizce</option>
<option value="es-ES">🇪🇸 İspanyolca</option>
<option value="ru-RU">🇷🇺 Rusça</option>
<option value="fr-FR">🇫🇷 Fransızca</option>
<option value="it-IT">🇮🇹 İtalyanca</option>
<option value="ar-SA">🇸🇦 Arapça</option>
</select>

<label>Kişilik:</label>
<select id="personality" onchange="kisilikKaydet()">
<option value="arkadas">😎 Arkadaş canlısı</option>
<option value="komik">😂 Komik</option>
<option value="ogretmen">🎓 Öğretmen</option>
<option value="ciddi">🧠 Ciddi</option>
</select>

<label><input type="checkbox" id="voiceAnswer" checked> Sesli cevap</label>
<button class="secondary" onclick="temaDegistir()">🌗 Tema</button>
</div>

<div id="messages"></div>
<div id="status"></div>

<div class="composer">
<textarea id="message" placeholder="ÖMER AI'ye bir şey sor..." onkeydown="enterGonder(event)"></textarea>
<img id="preview">
<div class="actions">
<button onclick="gonder()">Gönder ➤</button>
<button class="secondary" onclick="dinle()">🎤</button>
<label class="filebtn secondary">📎 Görsel
<input type="file" id="imageInput" accept="image/png,image/jpeg,image/webp" hidden onchange="gorselSec(event)">
</label>
<button class="secondary" onclick="konusmayiDurdur()">🔇</button>
</div>
</div>
</main>
</div>

<script>
const API_URL="https://omer-ai-server.onrender.com";

const diller={
"tr-TR":"Turkish","de-DE":"German","en-US":"English",
"th-TH":"Thai","he-IL":"Hebrew","hi-IN":"Hindi",
"ja-JP":"Japanese","zh-CN":"Chinese","ko-KR":"Korean",
"pt-PT":"Portuguese","es-ES":"Spanish","ru-RU":"Russian",
"fr-FR":"French","it-IT":"Italian","ar-SA":"Arabic"
};

let sohbetler=[];
let aktifSohbet=null;
let seciliGorsel=null;
let istekDevamEdiyor=false;

function kaydet(){
try{
localStorage.setItem("omerSohbetler",JSON.stringify(sohbetler));
}catch(e){
console.error("Sohbet geçmişi kaydedilemedi:",e);
}
}

function gecmisMenu(acik){
if(acik===undefined)document.body.classList.toggle("show-sidebar");
else document.body.classList.toggle("show-sidebar",acik);
}

function gecmisiGoster(){
const alan=document.getElementById("history");
alan.innerHTML="";

sohbetler.slice().reverse().forEach(sohbet=>{
const satir=document.createElement("div");
satir.className="history-item";

const ac=document.createElement("button");
ac.className="history-open"+(sohbet.id===aktifSohbet?" active":"");
ac.textContent=sohbet.title;
ac.title=sohbet.title;
ac.onclick=()=>sohbetAc(sohbet.id);

const sil=document.createElement("button");
sil.className="delete";
sil.textContent="🗑️";
sil.title="Sohbeti sil";
sil.onclick=()=>sohbetSil(sohbet.id);

satir.append(ac,sil);
alan.appendChild(satir);
});
}

function sohbetOlustur(){
const sohbet={
id:Date.now().toString()+Math.random().toString(16).slice(2),
title:"Yeni sohbet",
messages:[]
};
sohbetler.push(sohbet);
aktifSohbet=sohbet.id;
kaydet();
gecmisiGoster();
mesajlariGoster();
}

function aktifBul(){
return sohbetler.find(s=>s.id===aktifSohbet);
}

function sohbetAc(id){
aktifSohbet=id;
mesajlariGoster();
gecmisiGoster();
konusmayiDurdur();
gecmisMenu(false);
}

function sohbetSil(id){
const sohbet=sohbetler.find(s=>s.id===id);
if(!sohbet)return;
if(!confirm('"'+sohbet.title+'" sohbeti silinsin mi?'))return;

sohbetler=sohbetler.filter(s=>s.id!==id);

if(aktifSohbet===id){
aktifSohbet=sohbetler.length?sohbetler[sohbetler.length-1].id:null;
}
if(!aktifSohbet)sohbetOlustur();

kaydet();
gecmisiGoster();
mesajlariGoster();
}

function yeniSohbet(){
sohbetOlustur();
konusmayiDurdur();
gecmisMenu(false);
}

function mesajlariGoster(){
const alan=document.getElementById("messages");
alan.innerHTML="";
const sohbet=aktifBul();

if(!sohbet){
sohbetOlustur();
return;
}

if(!sohbet.messages.length){
mesajEkle("Merhaba! Ben ÖMER AI. Sana nasıl yardımcı olabilirim? 🚀","bot",null,false);
return;
}

sohbet.messages.forEach(m=>{
mesajEkle(m.text,m.role,null,false);
});
}

function mesajEkle(metin,tip,gorsel,kaydetMesaj=true){
const alan=document.getElementById("messages");
const div=document.createElement("div");
div.className="msg "+tip;
div.textContent=metin;

if(gorsel){
const img=document.createElement("img");
img.src=gorsel;
div.appendChild(img);
}
alan.appendChild(div);
alan.scrollTop=alan.scrollHeight;

if(kaydetMesaj){
let sohbet=aktifBul();
if(!sohbet){
sohbetOlustur();
sohbet=aktifBul();
}

sohbet.messages.push({text:metin,role:tip});

if(tip==="user"&&sohbet.title==="Yeni sohbet"){
sohbet.title=metin.slice(0,30)+(metin.length>30?"…":"");
}
kaydet();
gecmisiGoster();
}
return div;
}

function yaziyorGoster(){
const div=document.createElement("div");
div.className="msg bot";
div.id="typingIndicator";
div.innerHTML='<div class="typing"><span></span><span></span><span></span></div>';
document.getElementById("messages").appendChild(div);
div.scrollIntoView({behavior:"smooth"});
}

function yaziyorSil(){
const div=document.getElementById("typingIndicator");
if(div)div.remove();
}

function dilKaydet(){
localStorage.setItem("omerDil",document.getElementById("language").value);
}

function kisilikKaydet(){
localStorage.setItem("omerKisilik",document.getElementById("personality").value);
}

function enterGonder(e){
if(e.key==="Enter"&&!e.shiftKey){
e.preventDefault();
gonder();
}
}

async function gonder(){
if(istekDevamEdiyor)return;

const alan=document.getElementById("message");
const mesaj=alan.value.trim();
if(!mesaj&&!seciliGorsel)return;

if(!aktifBul())sohbetOlustur();

const gorsel=seciliGorsel;
mesajEkle(mesaj||"Bu görseli incele.","user",gorsel?.data);

alan.value="";
seciliGorsel=null;
document.getElementById("preview").style.display="none";
document.getElementById("imageInput").value="";

const sohbet=aktifBul();
const dil=document.getElementById("language").value;
const kisilik=document.getElementById("personality").value;

istekDevamEdiyor=true;
yaziyorGoster();
document.getElementById("status").textContent="ÖMER AI düşünüyor...";

try{
const response=await fetch(API_URL+"/api/chat",{
method:"POST",
headers:{"Content-Type":"application/json"},
body:JSON.stringify({
dil:dil,
dilAdi:diller[dil],
kisilik:kisilik,
gecmis:sohbet.messages.slice(-20),
imageBase64:gorsel?.base64||null,
imageMimeType:gorsel?.mimeType||null
})
});

let data;
try{
data=await response.json();
}catch(e){
throw new Error("Sunucudan geçerli cevap alınamadı.");
}

if(!response.ok)throw new Error(data.error||"Sunucu hatası");

const cevap=data.cevap||"Cevap alınamadı.";
yaziyorSil();
mesajEkle(cevap,"bot");

if(document.getElementById("voiceAnswer").checked){
seslendir(cevap);
}
}catch(error){
yaziyorSil();
mesajEkle("Hata: "+error.message,"bot");
}
finally{
istekDevamEdiyor=false;
document.getElementById("status").textContent="";
}
}

function gorselSec(event){
const file=event.target.files[0];
if(!file)return;
if(!["image/jpeg","image/png","image/webp"].includes(file.type)){
alert("Lütfen JPG, PNG veya WEBP görsel seç.");
return;
}
if(file.size>8*1024*1024){
alert("Görsel en fazla 8 MB olabilir.");
event.target.value="";
return;
}
const reader=new FileReader();
reader.onload=()=>{
const data=reader.result;
seciliGorsel={
data:data,
base64:data.split(",")[1],
mimeType:file.type
};
const preview=document.getElementById("preview");
preview.src=data;
preview.style.display="block";
};
reader.readAsDataURL(file);
}

function seslendir(metin){
if(!("speechSynthesis" in window))return;
speechSynthesis.cancel();
const dil=document.getElementById("language").value;
const ses=new SpeechSynthesisUtterance(metin);
ses.lang=dil;
ses.rate=1;
ses.pitch=1;
const voices=speechSynthesis.getVoices();
const uygun=voices.find(v=>v.lang.toLowerCase()===dil.toLowerCase())
||voices.find(v=>v.lang.toLowerCase().startsWith(dil.split("-")[0].toLowerCase()));
if(uygun)ses.voice=uygun;
speechSynthesis.speak(ses);
}

function dinle(){
const Recognition=window.SpeechRecognition||window.webkitSpeechRecognition;
if(!Recognition){
alert("Tarayıcın sesli yazmayı desteklemiyor.");
return;
}
const rec=new Recognition();
rec.lang=document.getElementById("language").value;
rec.interimResults=false;
rec.onstart=()=>document.getElementById("status").textContent="Dinliyorum...";
rec.onresult=(e)=>{
document.getElementById("message").value=e.results[0][0].transcript;
document.getElementById("status").textContent="";
};
rec.onerror=()=>document.getElementById("status").textContent="Mikrofon kullanılamadı.";
rec.onend=()=>document.getElementById("status").textContent="";
rec.start();
}

function konusmayiDurdur(){
if("speechSynthesis" in window)speechSynthesis.cancel();
}

function temaDegistir(){
document.body.classList.toggle("light");
localStorage.setItem("omerTema",document.body.classList.contains("light")?"light":"dark");
}

document.getElementById("language").value=localStorage.getItem("omerDil")||"tr-TR";
document.getElementById("personality").value=localStorage.getItem("omerKisilik")||"arkadas";

if(localStorage.getItem("omerTema")==="light"){
document.body.classList.add("light");
}

try{
sohbetler=JSON.parse(localStorage.getItem("omerSohbetler")||"[]");
if(!Array.isArray(sohbetler))sohbetler=[];
}catch(e){sohbetler=[];}

if(sohbetler.length){
aktifSohbet=sohbetler[sohbetler.length-1].id;
}else{
sohbetOlustur();
}

mesajlariGoster();
gecmisiGoster();
</script>
</body>
</html>
