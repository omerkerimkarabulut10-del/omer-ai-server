<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>ÖMER AI Ultimate</title>
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#7c3aed">
<style>
:root{--bg:#07050f;--p:#120c26;--c:#0d1226;--b:#2a2150;--ac:#7c3aed;--t:#ece8ff;--m:#9a93bd;--fs:15px}
[data-th=light]{--bg:#f6f4ff;--p:#fff;--c:#fff;--b:#ddd6fe;--t:#1e1b3a;--m:#6b6590}
[data-th=emerald]{--bg:#04100c;--p:#071c15;--c:#0a1a14;--b:#14532d;--ac:#10b981;--t:#e6fff5;--m:#86b9a5}
[data-th=amoled]{--bg:#000;--p:#000;--c:#0a0a0a;--b:#222}
*{box-sizing:border-box;margin:0}
html,body{height:100%;background:var(--bg);color:var(--t);font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
body{display:flex;overflow:hidden}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
#side{width:280px;background:var(--p);border-right:1px solid var(--b);display:flex;flex-direction:column;padding:12px;gap:8px;transition:margin .2s;flex-shrink:0}
#side.hide{margin-left:-280px}
.logo{display:flex;gap:10px;align-items:center;padding:6px}
.logo b{font-size:18px}.logo small{display:block;color:var(--m);font-size:12px}
.pro{background:#2a1a5e;border:1px solid var(--ac);border-radius:6px;font-size:10px;padding:1px 6px;margin-left:6px}
.new{background:linear-gradient(90deg,#9333ea,#4f46e5);padding:12px;border-radius:12px;font-weight:600}
.lbl{color:var(--m);font-size:11px;letter-spacing:1px;margin:10px 4px 2px}
.ws,.hist{display:flex;align-items:center;gap:8px;padding:10px 12px;border-radius:12px;text-align:left;width:100%;border:1px solid transparent}
.ws.on,.hist.on{background:#2a1450;border-color:var(--b)}
.hist{font-size:14px;justify-content:space-between}.hist span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hist i{opacity:.5;font-style:normal;padding:0 4px}
#hl{flex:1;overflow:auto;display:flex;flex-direction:column;gap:4px}
.foot{display:flex;justify-content:space-between;font-size:12px;color:var(--m)}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:#22c55e;margin-right:6px}
#main{flex:1;display:flex;flex-direction:column;min-width:0}
header{display:flex;align-items:center;gap:10px;padding:10px 14px;border-bottom:1px solid var(--b);padding-top:max(10px,env(safe-area-inset-top))}
header h1{font-size:18px}
.chip{border:1px solid var(--b);background:var(--c);border-radius:20px;padding:6px 12px;font-size:13px}
header .sp{flex:1}
#msgs{flex:1;overflow:auto;padding:16px;display:flex;flex-direction:column;gap:14px}
.wel{margin:auto;text-align:center;max-width:640px}
.wel h2{font-size:28px;margin:10px 0;background:linear-gradient(90deg,#fff,#c084fc);-webkit-background-clip:text;color:transparent}
.wel p{color:var(--m)}
.cards{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:18px}
.card{background:var(--c);border:1px solid var(--b);border-radius:16px;padding:14px;text-align:left;font-size:13px;color:var(--m)}
.card b{display:block;color:var(--t);margin-bottom:4px;font-size:14px}
.m{max-width:min(820px,92%);padding:12px 14px;border-radius:16px;line-height:1.55;font-size:var(--fs);word-wrap:break-word;overflow-wrap:anywhere}
.m.user{align-self:flex-end;background:#5b21b6;color:#fff}
.m.ai{align-self:flex-start;background:var(--c);border:1px solid var(--b)}
.m img{max-width:220px;border-radius:10px;display:block;margin-bottom:6px}
pre{background:#05030d;border:1px solid var(--b);border-radius:10px;margin:8px 0;overflow:hidden}
pre .bar{display:flex;justify-content:space-between;gap:6px;padding:6px 10px;background:#140e2e;font-size:12px;color:var(--m)}
pre .bar button{background:#2a1a5e;border-radius:6px;padding:2px 8px;margin-left:4px;font-size:12px}
pre code{color:#e9e5ff;display:block;padding:10px;overflow:auto;font:12.5px/1.5 ui-monospace,Menlo,Consolas,monospace;white-space:pre;max-height:420px}
code.i{background:#1c1440;padding:1px 5px;border-radius:5px}
.src{margin-top:8px;font-size:12px;display:flex;flex-wrap:wrap;gap:6px}
.src a{color:#c4b5fd;background:#1a1240;border-radius:8px;padding:3px 8px;text-decoration:none}
.typing{opacity:.7}
#bar{padding:10px 14px;padding-bottom:max(10px,env(safe-area-inset-bottom))}
#prev{display:flex;gap:8px;margin-bottom:6px;flex-wrap:wrap}
#prev div{position:relative}#prev img{height:56px;border-radius:8px}
#prev button{position:absolute;top:-6px;right:-6px;background:#dc2626;border-radius:50%;width:20px;height:20px;font-size:12px}
.row{display:flex;gap:8px;align-items:flex-end;background:var(--c);border:1px solid var(--b);border-radius:18px;padding:8px}
.ib{background:var(--c);border-radius:12px;width:42px;height:42px;font-size:18px;flex-shrink:0}
.ib.rec{background:#dc2626}
textarea{flex:1;background:none;border:0;outline:0;color:var(--t);font:inherit;resize:none;max-height:140px;padding:10px 4px}
.send{background:linear-gradient(90deg,#9333ea,#4f46e5);border-radius:12px;padding:0 18px;height:42px;font-weight:600}
.send:disabled{opacity:.5}
.hint{font-size:11px;color:var(--m);margin-top:6px;text-align:center}
.ov{position:fixed;inset:0;background:#000a;display:none;align-items:center;justify-content:center;z-index:20;padding:14px}
.ov.on{display:flex}
.box{background:var(--p);border:1px solid var(--b);border-radius:18px;padding:18px;width:min(460px,100%);max-height:90vh;overflow:auto}
.box h3{margin-bottom:12px}
.box label{display:block;font-size:13px;color:var(--m);margin:12px 0 4px}
select{width:100%;background:var(--c);color:var(--t);border:1px solid var(--b);border-radius:10px;padding:10px;font:inherit}
.tg{display:flex;justify-content:space-between;align-items:center;margin-top:12px}
.tg input{width:20px;height:20px}
#pv{position:fixed;inset:0;background:#000d;z-index:30;display:none;flex-direction:column}
#pv.on{display:flex}
#pv .t{display:flex;justify-content:space-between;padding:10px;background:var(--p)}
#pv iframe{flex:1;border:0;background:#fff}
@media(max-width:800px){#side{position:fixed;z-index:15;top:0;bottom:0;box-shadow:0 0 40px #000}.cards{grid-template-columns:1fr}.send span{display:none}}
</style>
</head>
<body>
<aside id="side">
  <div class="logo"><div style="font-size:30px">⬡</div><div><b>ÖMER AI<span class="pro">PRO v3</span></b><small>Ultimate Yapay Zekâ &amp; Stüdyo</small></div></div>
  <button class="new" onclick="newChat()">＋ Yeni Sohbet</button>
  <div class="lbl">ÇALIŞMA ALANLARI</div>
  <button class="ws" data-m="chat" onclick="setMode('chat')">💬 Yapay Zekâ Sohbet</button>
  <button class="ws" data-m="code" onclick="setMode('code')">&lt;/&gt; Kodlama Stüdyosu</button>
  <button class="ws" data-m="project" onclick="setMode('project')">📦 Proje Oluşturucu</button>
  <button class="ws" data-m="game" onclick="setMode('game')">🎮 3D Oyun Stüdyosu <span class="chip" style="font-size:10px;padding:2px 6px;color:#6ee7b7">WebGL</span></button>
  <div class="lbl">SOHBET GEÇMİŞİ</div>
  <div id="hl"></div>
  <div class="foot"><span class="chip"><i class="dot"></i>Hafıza Aktif</span><span><i class="dot"></i>Çevrimiçi</span></div>
</aside>

<div id="main">
  <header>
    <button class="ib" onclick="side.classList.toggle('hide')">☰</button>
    <h1>ÖMER AI</h1><span class="chip" id="modeChip">Sohbet</span>
    <span class="sp"></span>
    <button class="chip" id="setChip" onclick="openSet()"></button>
    <button class="ib" onclick="newChat()">✎</button>
  </header>
  <div id="msgs"></div>
  <div id="bar">
    <div id="prev"></div>
    <div class="row">
      <button class="ib" onclick="file.click()" title="Görsel">📎</button>
      <button class="ib" id="mic" onclick="toggleMic()" title="Sesli komut">🎤</button>
      <textarea id="inp" rows="1"></textarea>
      <button class="send" id="sendBtn" onclick="send()"><span>Gönder </span>➤</button>
    </div>
    <div class="hint">Enter: Gönder • Shift+Enter: Alt satır • ÖMER AI v3.0 Ultimate + Vision &amp; WebGL 3D</div>
  </div>
</div>
<input type="file" id="file" accept="image/*" multiple hidden>

<div class="ov" id="setOv" onclick="if(event.target===this)closeSet()">
  <div class="box">
    <h3>⚙ Ayarlar</h3>
    <label>Dil / Language</label>
    <select id="sLang">
      <option value="tr">Türkçe</option><option value="en">English</option><option value="de">Deutsch</option>
      <option value="es">Español</option><option value="fr">Français</option><option value="ar">العربية</option>
      <option value="th">ไทย</option><option value="he">עברית</option><option value="hi">हिन्दी</option><option value="zh">中文</option>
    </select>
    <label>Kişilik</label>
    <select id="sPer">
      <option value="friendly">Arkadaş canlısı</option><option value="professional">Profesyonel</option>
      <option value="teacher">Öğretmen</option><option value="funny">Esprili</option>
      <option value="concise">Kısa ve net</option><option value="creative">Yaratıcı</option>
    </select>
    <label>Tema</label><select id="sTheme"><option value="dark">🌙 Dark</option><option value="light">☀️ Light</option><option value="emerald">🌿 Emerald</option><option value="amoled">⚫ AMOLED</option></select><select id="sFs" style="margin-top:8px"><option value="13">Aa 13</option><option value="15">Aa 15</option><option value="17">Aa 17</option><option value="19">Aa 19</option></select>
    <div class="tg"><span>🌐 Web araması</span><input type="checkbox" id="sSea"></div>
    <div class="tg"><span>🔊 Sesli cevap</span><input type="checkbox" id="sTts"></div>
    <label>Hafıza (her satır bir bilgi)</label>
    <textarea id="sMem" rows="4" style="width:100%;background:var(--c);border:1px solid var(--b);border-radius:10px;padding:10px"></textarea>
    <div class="tg"><button class="chip" onclick="clearAll()">🗑 Tüm sohbetleri sil</button><button class="send" onclick="saveSet()">Kaydet</button></div>
  </div>
</div>

<div id="pv"><div class="t"><b>Önizleme</b><button class="chip" onclick="pv.classList.remove('on');pf.srcdoc=''">✕ Kapat</button></div><iframe id="pf" sandbox="allow-scripts allow-pointer-lock"></iframe></div>

<script>
const $=id=>document.getElementById(id);
const UI={tr:['ÖMER AI Ultimate\'e bir mesaj yazın...','Gönder'],en:['Message ÖMER AI Ultimate...','Send'],de:['Nachricht an ÖMER AI...','Senden'],es:['Escribe a ÖMER AI...','Enviar'],fr:['Écrivez à ÖMER AI...','Envoyer'],ar:['اكتب رسالة...','إرسال'],th:['พิมพ์ข้อความ...','ส่ง'],he:['כתוב הודעה...','שלח'],hi:['संदेश लिखें...','भेजें'],zh:['输入消息...','发送']};
const SR={tr:'tr-TR',en:'en-US',de:'de-DE',es:'es-ES',fr:'fr-FR',ar:'ar-SA',th:'th-TH',he:'he-IL',hi:'hi-IN',zh:'zh-CN'};
const MODES={chat:'Sohbet',code:'Kodlama',project:'Proje',game:'3D Oyun'};
const WEL={chat:['💬 Akıllı Sohbet &amp; Analiz','Soru sorun, görsel gönderin, web\'de arayın.'],code:['⚡ Kodlama Stüdyosu','HTML, JS, Python ve daha fazlası için kod yazın, hata ayıklayın.'],project:['📦 Proje Oluşturucu','Fikrinizi anlatın, dosyalarıyla birlikte projeyi çıkarayım.'],game:['🎮 3D Oyun Stüdyosu','Three.js ile oynanabilir 3D oyun üretin ve hemen önizleyin.']};
const SUG={chat:['Bugün dünyada neler oldu? Webde ara.','Bana kendini tanıt'],code:['Todo uygulaması yaz (HTML+JS)','Python ile hesap makinesi'],project:['Portfolyo web sitesi projesi oluştur','Hava durumu uygulaması'],game:['Uzay gemisi 3D oyunu yap','Küp toplama 3D oyunu yap']};
const I=Object.fromEntries(Object.entries({
tr:'Yeni Sohbet|ÇALIŞMA ALANLARI|Yapay Zekâ Sohbet|Kodlama Stüdyosu|Proje Oluşturucu|3D Oyun Stüdyosu|SOHBET GEÇMİŞİ|Ayarlar|Dil|Kişilik|Tema|Web araması|Sesli cevap|Kaydet|Düşünüyor...|Hoş Geldiniz',
en:'New Chat|WORKSPACES|AI Chat|Coding Studio|Project Builder|3D Game Studio|CHAT HISTORY|Settings|Language|Personality|Theme|Web search|Voice replies|Save|Thinking...|Welcome',
de:'Neuer Chat|ARBEITSBEREICHE|KI-Chat|Coding-Studio|Projekt-Builder|3D-Spielstudio|CHAT-VERLAUF|Einstellungen|Sprache|Persönlichkeit|Design|Websuche|Sprachausgabe|Speichern|Denkt nach...|Willkommen',
es:'Nuevo chat|ESPACIOS DE TRABAJO|Chat IA|Estudio de código|Creador de proyectos|Estudio de juegos 3D|HISTORIAL|Ajustes|Idioma|Personalidad|Tema|Búsqueda web|Respuesta por voz|Guardar|Pensando...|Bienvenido',
fr:'Nouvelle discussion|ESPACES DE TRAVAIL|Chat IA|Studio de code|Créateur de projets|Studio de jeux 3D|HISTORIQUE|Paramètres|Langue|Personnalité|Thème|Recherche web|Réponse vocale|Enregistrer|Réflexion...|Bienvenue',
ar:'محادثة جديدة|مساحات العمل|دردشة الذكاء الاصطناعي|استوديو البرمجة|منشئ المشاريع|استوديو ألعاب 3D|سجل المحادثات|الإعدادات|اللغة|الشخصية|المظهر|بحث الويب|رد صوتي|حفظ|يفكر...|مرحبًا',
th:'แชทใหม่|พื้นที่ทำงาน|แชท AI|สตูดิโอเขียนโค้ด|ตัวสร้างโปรเจกต์|สตูดิโอเกม 3D|ประวัติแชท|การตั้งค่า|ภาษา|บุคลิก|ธีม|ค้นหาเว็บ|ตอบด้วยเสียง|บันทึก|กำลังคิด...|ยินดีต้อนรับ',
he:'שיחה חדשה|סביבות עבודה|צ׳אט AI|סטודיו קוד|בונה פרויקטים|סטודיו משחקי 3D|היסטוריית שיחות|הגדרות|שפה|אישיות|ערכת נושא|חיפוש ברשת|תגובה קולית|שמור|חושב...|ברוכים הבאים',
hi:'नई चैट|कार्यक्षेत्र|AI चैट|कोडिंग स्टूडियो|प्रोजेक्ट बिल्डर|3D गेम स्टूडियो|चैट इतिहास|सेटिंग्स|भाषा|व्यक्तित्व|थीम|वेब खोज|आवाज़ में उत्तर|सहेजें|सोच रहा है...|स्वागत है',
zh:'新对话|工作区|AI 聊天|编程工作室|项目构建器|3D 游戏工作室|聊天记录|设置|语言|个性|主题|网页搜索|语音回复|保存|思考中...|欢迎'
}).map(([k,v])=>[k,v.split('|')]));
const tt=i=>I[S.set.lang][i];
function i18n(){const q=s=>document.querySelector(s),a=s=>document.querySelectorAll(s),h=document.documentElement;
h.dataset.th=S.set.theme||'dark';h.style.setProperty('--fs',(S.set.fs||15)+'px');
q('.new').textContent='＋ '+tt(0);const l=a('.lbl');l[0].textContent=tt(1);l[1].textContent=tt(6);
[['chat','💬',2],['code','</>',3],['project','📦',4],['game','🎮',5]].forEach(([m,e,i])=>q('.ws[data-m='+m+']').firstChild.textContent=e+' '+tt(i));
q('.box h3').textContent='⚙ '+tt(7);const b=a('.box label');b[0].textContent=tt(8);b[1].textContent=tt(9);b[2].textContent=tt(10);
const s=a('.tg span');s[0].textContent='🌐 '+tt(11);s[1].textContent='🔊 '+tt(12);q('.tg .send').textContent=tt(13)}
let S=JSON.parse(localStorage.getItem('omer3')||'null')||{chats:[],cur:null,mode:'chat',set:{lang:'tr',persona:'friendly',search:true,tts:false},mem:[]};
let imgs=[],busy=false,rec=null;
const save=()=>{const c=JSON.parse(JSON.stringify(S));c.chats.forEach(ch=>ch.msgs.forEach(m=>delete m.images));try{localStorage.setItem('omer3',JSON.stringify(c))}catch(e){}};
const cur=()=>S.chats.find(c=>c.id===S.cur);
const esc=s=>s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');

function newChat(){const c={id:Date.now(),title:'Yeni Sohbet',mode:S.mode,msgs:[]};S.chats.unshift(c);S.cur=c.id;save();render();if(innerWidth<800)side.classList.add('hide')}
function setMode(m){S.mode=m;newChat()}
function delChat(id,e){e.stopPropagation();S.chats=S.chats.filter(c=>c.id!==id);if(S.cur===id)S.cur=S.chats[0]?.id||null;if(!S.cur)return newChat();save();render()}
function openChat(id){S.cur=id;S.mode=cur().mode||'chat';save();render();if(innerWidth<800)side.classList.add('hide')}

function render(){
  const L=S.set.lang;document.documentElement.dir=(L==='ar'||L==='he')?'rtl':'ltr';
  i18n();inp.placeholder=UI[L][0];sendBtn.firstElementChild.textContent=UI[L][1]+' ';
  setChip.textContent='● '+$('sPer').selectedOptions[0]?.text+' • '+L.toUpperCase();
  modeChip.textContent=tt({chat:2,code:3,project:4,game:5}[S.mode]);
  document.querySelectorAll('.ws').forEach(b=>b.classList.toggle('on',b.dataset.m===S.mode));
  hl.innerHTML=S.chats.map(c=>`<button class="hist ${c.id===S.cur?'on':''}" onclick="openChat(${c.id})"><span>💬 ${esc(c.title)}</span><i onclick="delChat(${c.id},event)">✕</i></button>`).join('');
  const c=cur();if(!c)return newChat();
  if(!c.msgs.length){const w=WEL[S.mode];msgs.innerHTML=`<div class="wel"><div style="font-size:54px">⬡</div><h2>ÖMER AI Ultimate — ${tt(15)}</h2><p>Gelişmiş sohbet, görsel analizi, web araması, hafıza, sesli komutlar, kodlama ve Three.js tabanlı 3D oyun motoru.</p><div class="cards"><div class="card"><b>${w[0]}</b>${w[1]}</div>${SUG[S.mode].map(s=>`<button class="card" onclick="inp.value=this.textContent;send()">${s}</button>`).join('')}</div></div>`;return}
  msgs.innerHTML='';c.msgs.forEach(addMsg);msgs.scrollTop=msgs.scrollHeight;
}

function fmt(t){
  let h=esc(t);
  h=h.replace(/```(\w*)\n?([\s\S]*?)```/g,(_,l,c)=>{const html=/^(html|htm)$/i.test(l)||/<!doctype html|<html/i.test(c);return`<pre><div class="bar"><span>${l||'code'}</span><span>${html?'<button onclick="prevCode(this)">▶ Önizle</button>':''}<button onclick="copyCode(this)">Kopyala</button></span></div><code>${c}</code></pre>`});
  return h.replace(/`([^`\n]+)`/g,'<code class="i">$1</code>').replace(/\*\*([^*\n]+)\*\*/g,'<b>$1</b>').replace(/\n/g,'<br>').replace(/<\/pre><br>/g,'</pre>').replace(/<br><pre>/g,'<pre>');
}
function addMsg(m){
  const d=document.createElement('div');d.className='m '+(m.role==='user'?'user':'ai');
  let h='';(m.images||[]).forEach(i=>h+=`<img src="${i}">`);if(m.imgCount&&!m.images)h+=`<div style="opacity:.6;font-size:12px">🖼 ${m.imgCount} görsel</div>`;
  h+=m.role==='user'?esc(m.text).replace(/\n/g,'<br>'):fmt(m.text);
  if(m.sources?.length)h+='<div class="src">'+m.sources.slice(0,6).map(s=>`<a target="_blank" rel="noopener" href="${esc(s.uri)}">🔗 ${esc(s.title||'kaynak')}</a>`).join('')+'</div>';
  d.innerHTML=h;msgs.appendChild(d);return d;
}
function copyCode(b){navigator.clipboard.writeText(b.closest('pre').querySelector('code').textContent);b.textContent='✓'}
function prevCode(b){pf.srcdoc=b.closest('pre').querySelector('code').textContent;pv.classList.add('on')}

file.onchange=async()=>{for(const f of file.files){imgs.push(await shrink(f))}file.value='';drawPrev()};
function shrink(f){return new Promise(r=>{const im=new Image,u=URL.createObjectURL(f);im.onload=()=>{const k=Math.min(1,1280/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=im.width*k;c.height=im.height*k;c.getContext('2d').drawImage(im,0,0,c.width,c.height);URL.revokeObjectURL(u);r(c.toDataURL('image/jpeg',.85))};im.src=u})}
function drawPrev(){prev.innerHTML=imgs.map((s,i)=>`<div><img src="${s}"><button onclick="imgs.splice(${i},1);drawPrev()">✕</button></div>`).join('')}
addEventListener('paste',async e=>{for(const it of e.clipboardData.items)if(it.type.startsWith('image/')){imgs.push(await shrink(it.getAsFile()));drawPrev()}});

  function toggleMic(){
  const R=window.SpeechRecognition||window.webkitSpeechRecognition;if(!R)return alert('Tarayıcı sesli komutu desteklemiyor.');
  if(rec){rec.stop();return}
  rec=new R;rec.lang=SR[S.set.lang];rec.interimResults=true;rec.continuous=false;mic.classList.add('rec');
  rec.onresult=e=>{inp.value=[...e.results].map(r=>r[0].transcript).join('')};
  rec.onend=()=>{rec=null;mic.classList.remove('rec');if(inp.value.trim())send()};
  rec.onerror=()=>{};rec.start();
}

async function send(){
  const text=inp.value.trim();if((!text&&!imgs.length)||busy)return;
  const c=cur();busy=true;sendBtn.disabled=true;
  const um={role:'user',text:text||'Bu görseli analiz et.',images:imgs.slice(),imgCount:imgs.length};
  if(/^(hatırla|remember)[:\s]/i.test(text)){S.mem.push(text.replace(/^(hatırla|remember)[:\s]*/i,''))}
  c.msgs.push(um);if(c.msgs.length===1)c.title=(text||'Görsel').slice(0,30);
  inp.value='';inp.style.height='auto';imgs=[];drawPrev();render();
  const t=addMsg({role:'ai',text:'⏳ '+tt(14)});t.classList.add('typing');msgs.scrollTop=msgs.scrollHeight;
  try{
    const r=await fetch('/api/stream',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({messages:c.msgs.map(m=>({role:m.role,text:m.text,images:m.images})),lang:S.set.lang,persona:S.set.persona,mode:S.mode,search:S.set.search,memory:S.mem})});
    if(!r.ok){const e=await r.json().catch(()=>({}));throw new Error(e.error||'Sunucu hatası '+r.status)}
    const rd=r.body.getReader(),dc=new TextDecoder();let buf='',txt='',src=[];t.classList.remove('typing');
    for(;;){const{done,value}=await rd.read();if(done)break;buf+=dc.decode(value,{stream:true});let i;
      while((i=buf.indexOf('\n'))>=0){const ln=buf.slice(0,i);buf=buf.slice(i+1);if(!ln)continue;const o=JSON.parse(ln);
        if(o.error)throw new Error(o.error);if(o.t){txt+=o.t;t.innerHTML=fmt(txt);msgs.scrollTop=msgs.scrollHeight}if(o.sources)src=o.sources}}
    const j={text:txt||'...'};
    c.msgs.push({role:'ai',text:j.text,sources:src});
    if(S.set.tts&&speechSynthesis){const u=new SpeechSynthesisUtterance(j.text.replace(/```[\s\S]*?```/g,' ').replace(/[*`#]/g,''));u.lang=SR[S.set.lang];speechSynthesis.cancel();speechSynthesis.speak(u)}
  }catch(e){c.msgs.push({role:'ai',text:'❌ Hata: '+e.message})}
  busy=false;sendBtn.disabled=false;save();render();msgs.scrollTop=msgs.scrollHeight;
}
inp.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey&&innerWidth>800){e.preventDefault();send()}});
inp.addEventListener('input',()=>{inp.style.height='auto';inp.style.height=Math.min(inp.scrollHeight,140)+'px'});

function openSet(){sTheme.value=S.set.theme||'dark';sFs.value=S.set.fs||15;sLang.value=S.set.lang;sPer.value=S.set.persona;sSea.checked=S.set.search;sTts.checked=S.set.tts;sMem.value=S.mem.join('\n');setOv.classList.add('on')}
function closeSet(){setOv.classList.remove('on')}
function saveSet(){S.set={lang:sLang.value,persona:sPer.value,search:sSea.checked,tts:sTts.checked,theme:sTheme.value,fs:+sFs.value};S.mem=sMem.value.split('\n').map(s=>s.trim()).filter(Boolean);save();closeSet();render()}
function clearAll(){if(confirm('Tüm sohbetler silinsin mi?')){S.chats=[];S.cur=null;newChat();closeSet()}}

if(innerWidth<800)side.classList.add('hide');
if(!S.cur||!cur())newChat();else render();
</script>
