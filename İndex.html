<script>

const SUG={chat:['BugÃ¼n dÃ¼nyada neler oldu? Webde ara.','Bana kendini tanÄ±t'],code:['Todo uygulamasÄ± yaz (HTML+JS)','Python ile hesap makinesi'],project:['Portfolyo web sitesi projesi oluÅŸtur','Hava durumu uygulamasÄ±'],game:['Uzay gemisi 3D oyunu yap','KÃ¼p toplama 3D oyunu yap']};

function render(){
  const L=S.set.lang;document.documentElement.dir=(L==='ar'||L==='he')?'rtl':'ltr';

  modeChip.textContent=MODES[S.mode];
  document.querySelectorAll('.ws').forEach(b=>b.classList.toggle('on',b.dataset.m===S.mode));
  hl.innerHTML=S.chats.map(c=>`<button class="hist ${c.id===S.cur?'on':''}" onclick="openChat(${c.id})"><span>ðŸ’¬ ${esc(c.title)}</span><i onclick="delChat(${c.id},event)">âœ•</i></button>`).join('');
  const c=cur();if(!c)return newChat();
  if(!c.msgs.length){const w=WEL[S.mode];msgs.innerHTML=`<div class="wel"><div style="font-size:54px">â¬¡</div><h2>Ã–MER AI Ultimate'e HoÅŸ Geldiniz</h2><p>GeliÅŸmiÅŸ sohbet, gÃ¶rsel analizi, web aramasÄ±, hafÄ±za, sesli komutlar, kodlama ve Three.js tabanlÄ± 3D oyun motoru.</p><div class="cards"><div class="card"><b>${w[0]}</b>${w[1]}</div>${SUG[S.mode].map(s=>`<button class="card" onclick="inp.value=this.textContent;send()">${s}</button>`).join('')}</div></div>`;return}
  msgs.innerHTML='';c.msgs.forEach(addMsg);msgs.scrollTop=msgs.scrollHeight;

function fmt(t){
  let h=esc(t);
  h=h.replace(/```(\w*)\n?([\s\S]*?)```/g,(_,l,c)=>{const html=/^(html|htm)$/i.test(l)||/<!doctype html|<html/i.test(c);return`<pre><div class="bar"><span>${l||'code'}</span><span>${html?'<button onclick="prevCode(this)">â–¶ Ã–nizle</button>':''}<button onclick="copyCode(this)">Kopyala</button></span></div><code>${c}</code></pre>`});
  return h.replace(/`([^`\n]+)`/g,'<code class="i">$1</code>').replace(/\*\*([^*\n]+)\*\*/g,'<b>$1</b>').replace(/\n/g,'<br>').replace(/<\/pre><br>/g,'</pre>').replace(/<br><pre>/g,'<pre>');
}
function addMsg(m){
  const d=document.createElement('div');d.className='m '+(m.role==='user'?'user':'ai');
  let h='';(m.images||[]).forEach(i=>h+=`<img src="${i}">`);if(m.imgCount&&!m.images)h+=`<div style="opacity:.6;font-size:12px">ðŸ–¼ ${m.imgCount} gÃ¶rsel</div>`;
  h+=m.role==='user'?esc(m.text).replace(/\n/g,'<br>'):fmt(m.text);
  if(m.sources?.length)h+='<div class="src">'+m.sources.slice(0,6).map(s=>`<a target="_blank" rel="noopener" href="${esc(s.uri)}">ðŸ”— ${esc(s.title||'kaynak')}</a>`).join('')+'</div>';
  d.innerHTML=h;msgs.appendChild(d);return d;
}

function toggleMic(){
  const R=window.SpeechRecognition||window.webkitSpeechRecognition;if(!R)return alert('TarayÄ±cÄ± sesli komutu desteklemiyor.');
  if(rec){rec.stop();return}
  rec=new R;rec.lang=SR[S.set.lang];rec.interimResults=true;rec.continuous=false;mic.classList.add('rec');
  rec.onresult=e=>{inp.value=[...e.results].map(r=>r[0].transcript).join('')};
  rec.onend=()=>{rec=null;mic.classList.remove('rec');if(inp.value.trim())send()};
  rec.onerror=()=>{};rec.start();
}

async function send(){
  const text=inp.value.trim();if((!text&&!imgs.length)||busy)return;
  const c=cur();busy=true;sendBtn.disabled=true;
  const um={role:'user',text:text||'Bu gÃ¶rseli analiz et.',images:imgs.slice(),imgCount:imgs.length};

  c.msgs.push(um);if(c.msgs.length===1)c.title=(text||'GÃ¶rsel').slice(0,30);
  inp.value='';inp.style.height='auto';imgs=[];drawPrev();render();
  const t=addMsg({role:'ai',text:'â³ DÃ¼ÅŸÃ¼nÃ¼yor...'});t.classList.add('typing');msgs.scrollTop=msgs.scrollHeight;
  try{
    const r=await fetch('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({messages:c.msgs.map(m=>({role:m.role,text:m.text,images:m.images})),lang:S.set.lang,persona:S.set.persona,mode:S.mode,search:S.set.search,memory:S.mem})});
    const j=await r.json();if(!r.ok)throw new Error(j.error);
    c.msgs.push({role:'ai',text:j.text,sources:j.sources});
    if(S.set.tts&&speechSynthesis){const u=new SpeechSynthesisUtterance(j.text.replace(/```[\s\S]*?```/g,' ').replace(/[*`#]/g,''));u.lang=SR[S.set.lang];speechSynthesis.cancel();speechSynthesis.speak(u)}
  }catch(e){c.msgs.push({role:'ai',text:'âŒ Hata: '+e.message})}
  busy=false;sendBtn.disabled=false;save();render();msgs.scrollTop=msgs.scrollHeight;
}

if(innerWidth<800)side.classList.add('hide');
if(!S.cur||!cur())newChat();else render();
</script>
